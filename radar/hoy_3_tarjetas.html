function lookupCardBySku(sku) {
  const key = asText(sku);
  if (!key) return null;
  for (const card of cardById.values()) {

  }
  if (!cachedData) return null;
  const lists = tabLists(cachedData);
  const bags = [...lists.cards, ...lists.queue, ...lists.decided, ...(cachedData.cards || []), ...(cachedData.parked || [])];
  return bags.find((c) => asText(c.sku) === key) || null;
}

function hallazgoOfferForItem(item) {

function hallazgoCsvBool(v) {

}

function hallazgoCsvValue(item, key, offer, card) {
  if (key === "sku") return item.sku || "";
  if (key === "upc") return item.upc || "";
  if (key === "name") return item.name || "";
  if (key === "estado") return item.decision || "";
  if (key === "qty") return item.qty == null ? "" : item.qty;
  if (key === "techo") return item.techo_mxn == null ? "" : item.techo_mxn;
  if (key === "landed") {
    if (offer && offer.found_landed != null) return offer.found_landed;
    if (item.found_landed != null) return item.found_landed;
    if (item.ganancia_estimada_mxn != null) return item.ganancia_estimada_mxn;
    return "";
  }
  if (key === "margen") return item.roi_pct == null ? "" : item.roi_pct;
  if (key === "gate_ok") return hallazgoCsvBool(item.gate_ok);
  if (key === "why") return item.por_que || "";
  if (key === "url_amazon") return item.url_amazon || (card && asText(firstDefined(card.shopping_url, card.url_amazon))) || "";
  if (key === "url_ml") return item.url_ml || (card && asText(firstDefined(card.marketplace_url, card.url_ml))) || "";
  if (key === "url_oferta") return item.url_oferta || (offer && offer.found_url) || "";
  if (key === "notas") return item.notas || item.gate_reason_es || "";
  if (key === "oferta_encontrada") return isOfertaEncontrada(offer) ? "true" : "false";
  return "";
}

function hallazgoCsv() {

    return HALLAZGO_CSV_COLS.map((col) => csvCell(hallazgoCsvValue(item, col.key, offer, card)));
  });
  return "\uFEFF" + [header, ...rows.map((r) => r.join(","))].join("\n");
}

function parseCsv(text) {
  const src = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [];
  let cell = "";
  let i = 0;
  let inQ = false;
  while (i < src.length) {
    const ch = src[i];
    if (inQ) {
      if (ch === "\"") {
        if (src[i + 1] === "\"") { cell += "\""; i += 2; continue; }
        inQ = false;
        i++;
        continue;
      }
      cell += ch;
      i++;
      continue;
    }
    if (ch === "\"") { inQ = true; i++; continue; }
    if (ch === ",") { row.push(cell); cell = ""; i++; continue; }
    if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && src[i + 1] === "\n") i++;
      row.push(cell);
      cell = "";
      if (row.some((c) => String(c).trim())) rows.push(row);
      row = [];
      i++;
      continue;
    }
    cell += ch;
    i++;
  }
  if (cell || row.length) {
    row.push(cell);
    if (row.some((c) => String(c).trim())) rows.push(row);
  }
  return rows;
}

function normCsvHeader(h) {
  return String(h || "").trim().toLowerCase().replace(/^\uFEFF/, "").replace(/[\s-]+/g, "_");
}

function importOfferRows(text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return { applied: 0, skipped: 0, error: "El CSV no tiene filas" };
  const headers = rows[0].map(normCsvHeader);
  const idx = (...names) => {
    for (const n of names) {
      const i = headers.indexOf(n);
      if (i >= 0) return i;
    }
    return -1;
  };
  const col = {
    export_id: idx("export_id"),
    sku: idx("sku"),
    found_url: idx("found_url", "url", "offer_url"),
    store: idx("store", "found_supplier", "tienda"),
    item_price: idx("item_price", "found_product_price_mxn", "precio", "precio_visto"),
    shipping: idx("shipping", "found_shipping_mxn", "envio", "envío"),
    fees: idx("fees", "found_import_fees_mxn", "comision", "comisión"),
    found_landed: idx("found_landed", "found_landed_cost_mxn", "landed", "precio_encontrado"),
    status: idx("status", "estado")
  };
  if (col.sku < 0) return { applied: 0, skipped: 0, error: "Falta la columna sku" };
  const bySku = { ...readOfferOverlays() };
  let applied = 0;
  let skipped = 0;
  for (const r of rows.slice(1)) {
    const get = (k) => (col[k] >= 0 ? r[col[k]] : "");
    const sku = asText(get("sku"));
    if (!sku) { skipped++; continue; }
    const statusRaw = get("status");
    const statusNorm = offerStatus(statusRaw);
    const status = (DECISION_IDS.includes(statusNorm) || statusNorm === RESURGIDO) ? "" : statusRaw;
    const raw = {
      export_id: get("export_id"),
      sku,
      found_url: get("found_url"),
      store: get("store"),
      item_price: get("item_price"),
      shipping: get("shipping"),
      fees: get("fees"),
      found_landed: get("found_landed"),
      status,
      imported_at: new Date().toISOString()
    };
    const offer = normalizeExternalOffer(raw);
    if (!offer || (!offer.found_url && offer.found_landed == null && !offer.store)) {
      skipped++;
      continue;
    }
    if (!offer.status) offer.status = OFFER_FOUND;
    bySku[sku] = offer;
    applied++;
  }
  writeOfferOverlays(bySku);
  const resurgidos = afterOfferImport();
  return { applied, skipped, resurgidos: resurgidos.length };
}

function csvHeaderIndex(headers, ...names) {
  for (const n of names) {
    const i = headers.indexOf(n);
    if (i >= 0) return i;
  }
  return -1;
}

function importEstadoRows(text) {
  const rows = parseCsv(text);
  if (rows.length < 2) return { applied: 0, skipped: 0, estados: 0, ofertas: 0, resurgidos: 0, error: "El CSV no tiene filas" };
  const headers = rows[0].map(normCsvHeader);
  const idx = (...names) => csvHeaderIndex(headers, ...names);
  const col = {
    sku: idx("sku"),
    upc: idx("upc"),
    estado: idx("estado"),
    qty: idx("qty"),
    techo: idx("techo", "techo_mxn", "max_landed_cost"),
    landed: idx("landed", "found_landed", "found_landed_cost_mxn"),
    margen: idx("margen", "roi_pct", "roi"),
    gate_ok: idx("gate_ok"),
    why: idx("why", "por_que"),
    url_amazon: idx("url_amazon", "shopping_url"),
    url_ml: idx("url_ml", "marketplace_url"),
    url_oferta: idx("url_oferta", "found_url", "offer_url"),
    notas: idx("notas", "notes"),
    oferta_encontrada: idx("oferta_encontrada")
  };
  if (col.sku < 0) return { applied: 0, skipped: 0, estados: 0, ofertas: 0, resurgidos: 0, error: "Falta la columna sku" };
  const byEstado = { ...readEstadoOverlays() };
  const byOffer = { ...readOfferOverlays() };
  const importedAt = new Date().toISOString();
  let applied = 0;
  let skipped = 0;
  let estados = 0;
  let ofertas = 0;
  for (const r of rows.slice(1)) {
    const get = (k) => (col[k] >= 0 ? r[col[k]] : "");
    const sku = asText(get("sku"));
    if (!sku) { skipped++; continue; }
    const estado = parseImportedEstado(get("estado"));
    const offerFlag = parseCsvFlag(get("oferta_encontrada"));
    const urlOferta = asText(get("url_oferta"));
    const landed = parseMoney(get("landed"));
    const upc = asText(get("upc"));
    const qty = numOrNull(get("qty"));
    const techo = parseMoney(get("techo"));
    const margen = numOrNull(get("margen"));
    const gate_ok = parseCsvFlag(get("gate_ok"));
    const why = asText(get("why"));
    const urlAmazon = asText(get("url_amazon"));
    const urlMl = asText(get("url_ml"));
    const notas = asText(get("notas"));
    const hasEstado = !!estado;
    const hasEnrich = !!(upc || qty != null || techo != null || landed != null || margen != null || gate_ok != null || why || urlAmazon || urlMl || urlOferta || notas || offerFlag != null);
    if (!hasEstado && !hasEnrich) { skipped++; continue; }
    const prev = byEstado[sku] && typeof byEstado[sku] === "object" ? { ...byEstado[sku] } : { sku };
    prev.sku = sku;
    prev.imported_at = importedAt;
    if (hasEstado) prev.estado = estado;
    if (upc) prev.upc = upc;
    if (qty != null) prev.qty = qty;
    if (techo != null) prev.techo = techo;
    if (landed != null) prev.landed = landed;
    if (margen != null) prev.margen = margen;
    if (gate_ok === true || gate_ok === false) prev.gate_ok = gate_ok;
    if (why) prev.why = why;
    if (urlAmazon) prev.url_amazon = urlAmazon;
    if (urlMl) prev.url_ml = urlMl;
    if (urlOferta) prev.url_oferta = urlOferta;
    if (notas) prev.notas = notas;
    if (offerFlag != null) prev.oferta_encontrada = offerFlag;
    byEstado[sku] = prev;
    if (hasEstado) estados++;
    const wantOffer = offerFlag === true || (offerFlag !== false && (!!urlOferta || landed != null));
    if (wantOffer) {
      const offer = normalizeExternalOffer({
        sku,
        found_url: urlOferta,
        found_landed: landed,
        status: OFFER_FOUND,
        imported_at: importedAt
      });
      if (offer) {
        byOffer[sku] = offer;
        ofertas++;
      }
    }
    applied++;
  }
  writeEstadoOverlays(byEstado);
  writeOfferOverlays(byOffer);
  if (hallazgoDoc) applyEstadoOverlaysToDoc(hallazgoDoc);
  const resurgidos = afterOfferImport();
  const result = {
    applied,
    skipped,
    estados,
    ofertas,
    resurgidos: resurgidos.length,
    hook: "refreshResurgidos",
    source_tab: activeTab
  };
  writeImportResult(result);
  return result;
}

function estadoImportMessage(result) {
  if (!result || result.error) return (result && result.error) || "No pude importar el CSV";
  const bits = [];
  if (result.estados) bits.push(`${result.estados} estado${result.estados === 1 ? "" : "s"}`);
  if (result.ofertas) bits.push(`${result.ofertas} oferta${result.ofertas === 1 ? "" : "s"}`);
  if (!bits.length) bits.push(`${result.applied} fila${result.applied === 1 ? "" : "s"}`);
  if (result.ofertas) bits.push("sin tocar ganancia ni techo");
  if (result.skipped) bits.push(`${result.skipped} sin datos`);
  if (result.resurgidos) bits.push(`${result.resurgidos} resurgido${result.resurgidos === 1 ? "" : "s"}`);
  bits.push("el radar no compra solo");
  return "Aplicamos " + bits.join(" · ");
}

async function downloadText(filename, text, mime) {
  const type = mime || "text/plain;charset=utf-8";
  const isCsv = /\.csv$/i.test(filename) || /^text\/csv/i.test(type);

  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: isCsv
          ? [{ description: "CSV", accept: { "text/csv": [".csv"] } }]
          : [{ description: "File", accept: { [type.split(";")[0]]: ["." + (filename.split(".").pop() || "txt")] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(new File([text], filename, { type: type }));
      await writable.close();
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }

  const file = new File([text], filename, { type: type });
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.download = filename;
  a.setAttribute("download", filename);
  a.rel = "noopener";
  a.setAttribute("aria-hidden", "true");
  a.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  a.href = url;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    a.remove();
    URL.revokeObjectURL(url);
  }, 4000);
}

async function copyTextCsv(text) {
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    showToast("CSV copiado — pégalo en ChatGPT");
    return;
  } catch (_) { /* execCommand below */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if (!ok) throw new Error("copy");
    showToast("CSV copiado — pégalo en ChatGPT");
  } catch (_) {
    showToast("No se pudo copiar — usa Exportar CSV");
  }
}

async function retryAllPending() {
  const items = readPending().items.filter((x) => x && x.status !== "cancelled" && !isImportedPurchase(x));
  for (const item of items) await retrySyncItem(item);
  if (cachedData) paint(cachedData);
}

function lockCard(cardEl, outcome, extra) {
  const doneId = cardEl.getAttribute("data-done-id");
  const sku = cardEl.getAttribute("data-sku");
  const card = cardById.get(doneId);
  const keepVisible = outcome === "purchased";
  const days = hideDaysFor(outcome, card);
  const payload = {
    done_id: doneId,
    sku,
    outcome,
    hide_until: keepVisible ? null : hideUntilIso(days),
    hide_days: keepVisible ? 0 : days
  };
  writeState(payload);
  appendInboxAction({ sku, done_id: doneId, outcome });
  mirrorLocal({
    sku,
    action_key: cardEl.getAttribute("data-action-key"),
    outcome,
    ...(extra && extra.purchase ? { purchase: extra.purchase } : {})
  });
  if (!keepVisible && activeTab === TAB_HOY && isHidden(payload, card) && cachedData) {
    paint(cachedData);
    return;
  }
  if (keepVisible && cachedData) {
    paint(cachedData);
    return;
  }
  cardEl.classList.toggle("done", outcome !== "skip");
  cardEl.classList.toggle("skipped", outcome === "skip");
  cardEl.querySelectorAll(".actions button").forEach((b) => { b.disabled = true; });
  cardEl.querySelector("[data-outcomes]")?.classList.remove("open");
  const status = cardEl.querySelector("[data-status]");
  if (status) { status.textContent = statusMessage(payload); status.classList.add("show"); }
}

function closeModal() {
  const root = document.getElementById("modal-root");
  root.hidden = true;
  root.innerHTML = "";
  document.removeEventListener("keydown", onModalKey);
  if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
}

function onModalKey(ev) {
  if (ev.key === "Escape") {
    ev.preventDefault();
    closeModal();
  }
}

function inferStoreValue(card, existingStore) {
  const known = knownStores();
  const candidates = [existingStore, card && card.supplier_name, defaultStore(card)];
  for (const raw of candidates) {
    const name = normalizeStoreName(raw);
    if (!name || (isDefaultStoreName(name) && name !== "Amazon" && name !== "ML")) continue;
    const hit = known.find((s) => s.value.toLowerCase() === name.toLowerCase());
    if (hit) return hit.value;
    if (name === "Amazon" || name === "ML") return name;
  }
  return "otro";
}

function storeSelectHtml(selected) {
  const opts = [
    ...knownStores(),
    { value: "otro", label: "Otra" }
  ];
  return opts.map((o) =>
    `<option value="${esc(o.value)}"${o.value === selected ? " selected" : ""}>${esc(o.label)}</option>`
  ).join("");
}

function openPurchaseModal(cardEl) {
  const id = cardEl.getAttribute("data-done-id");
  const card = cardById.get(id);
  if (!card || livePurchaseForCard(card)) return;
  lastFocus = document.activeElement;
  const existing = purchaseForCard(card) || {};
  const offer = cardExternalOffer(card);
  const offerFound = isOfertaEncontrada(offer);
  const qty = existing.qty || (offerFound && offer.suggested_qty) || suggestedQty(card);
  const cap = offerCap(card, offerFound ? offer : null);
  if (offerFound && offer.store) rememberCustomStore(offer.store);
  const landedPrefill = offerFound && offer.found_landed != null ? offer.found_landed : null;
  const storeVal = inferStoreValue(card, existing.store || (offerFound ? offer.store : ""));
  const otherStore = storeVal === "otro"
    ? (existing.store && !isDefaultStoreName(existing.store) ? existing.store : ((offerFound && offer.store) || card.supplier_name || ""))
    : "";
  const unitPrefill = existing.unit_price != null ? existing.unit_price : landedPrefill;
  const totalPrefill = existing.total != null ? existing.total : (landedPrefill != null ? Math.round(landedPrefill * qty * 100) / 100 : "");
  const urlPrefill = existing.url || (offerFound && offer.found_url) || "";
  const root = document.getElementById("modal-root");
  root.hidden = false;
  root.innerHTML = `
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="buy-title">
      <h2 id="buy-title">Anota la compra</h2>
      <p class="hint">${esc(card.sku || "")} · ${esc(productName(card))}${cap ? ". " + compraSiNoPasa(card) : ""}. Escribe lo que pagaste. La tarjeta se queda a la vista.</p>
      <p class="modal-error" id="buy-error">Falta cantidad o un precio (unitario o total).</p>
      <form id="buy-form">
        <div class="field-row">
          <div class="field">
            <label for="buy-qty">Piezas</label>
            <input id="buy-qty" name="qty" type="number" min="1" step="1" value="${esc(qty)}" required>
          </div>
          <div class="field">
            <label for="buy-store">Tienda</label>
            <select id="buy-store" name="store">
              ${storeSelectHtml(storeVal)}
            </select>
          </div>
        </div>
        <div class="field" id="store-other-wrap" ${storeVal === "otro" ? "" : "hidden"}>
          <label for="buy-store-other">Nombre de la tienda</label>
          <input id="buy-store-other" name="store_other" type="text" value="${esc(otherStore)}" placeholder="Amazon México, Sanborns…">
        </div>
        ${offerFound ? `<div class="field">
          <label for="buy-landed">Precio encontrado / landed (MXN)</label>
          <input id="buy-landed" name="found_landed" type="number" min="0" step="0.01" inputmode="decimal" value="${landedPrefill != null ? esc(landedPrefill) : ""}">
          ${cap != null ? `<span class="techo-extra">Techo ${esc(money0(cap))} · ${esc(compraSiNoPasa(card))}</span>` : ""}
        </div>` : ""}
        <div class="field-row">
          <div class="field">
            <label for="buy-unit">Precio por pieza (MXN)</label>
            <input id="buy-unit" name="unit_price" type="number" min="0" step="0.01" inputmode="decimal" value="${unitPrefill != null && unitPrefill !== "" ? esc(unitPrefill) : ""}" placeholder="${cap ? money0(cap) : ""}">
          </div>
          <div class="field">
            <label for="buy-total">Total (MXN)</label>
            <input id="buy-total" name="total" type="number" min="0" step="0.01" inputmode="decimal" value="${totalPrefill !== "" && totalPrefill != null ? esc(totalPrefill) : ""}">
          </div>
        </div>
        <div class="field">
          <label for="buy-url">Liga de la compra (opcional)</label>
          <input id="buy-url" name="url" type="url" value="${esc(urlPrefill)}" placeholder="https://">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="1">Cierra</button>
          <button type="submit" class="btn-comprar">Anota la compra</button>
        </div>
      </form>
    </div>`;
  document.addEventListener("keydown", onModalKey);
  const qtyEl = root.querySelector("#buy-qty");
  const unitEl = root.querySelector("#buy-unit");
  const totalEl = root.querySelector("#buy-total");
  const landedEl = root.querySelector("#buy-landed");
  const storeEl = root.querySelector("#buy-store");
  const otherWrap = root.querySelector("#store-other-wrap");
  storeEl.addEventListener("change", () => {
    otherWrap.hidden = storeEl.value !== "otro";
  });
  const syncTotal = (from) => {
    const q = Number(qtyEl.value);
    const u = Number(unitEl.value);
    const t = Number(totalEl.value);
    const landed = landedEl && landedEl.value !== "" ? Number(landedEl.value) : null;
    if (from === "landed" && landedEl && landed != null && !Number.isNaN(landed)) {
      unitEl.value = String(landed);
      if (q > 0) totalEl.value = String(Math.round(q * landed * 100) / 100);
      return;
    }
    if (from === "unit" && q > 0 && u >= 0 && unitEl.value !== "") {
      totalEl.value = String(Math.round(q * u * 100) / 100);
      if (landedEl) landedEl.value = String(u);
    } else if (from === "total" && q > 0 && t >= 0 && totalEl.value !== "") {
      const nextUnit = Math.round((t / q) * 100) / 100;
      unitEl.value = String(nextUnit);
      if (landedEl) landedEl.value = String(nextUnit);
    } else if (from === "qty" && q > 0 && unitEl.value !== "" && u >= 0) {
      totalEl.value = String(Math.round(q * u * 100) / 100);
    }
  };
  if (landedEl) landedEl.addEventListener("input", () => syncTotal("landed"));
  unitEl.addEventListener("input", () => syncTotal("unit"));
  totalEl.addEventListener("input", () => syncTotal("total"));
  qtyEl.addEventListener("input", () => syncTotal("qty"));
  root.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closeModal));
  root.querySelector("#buy-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const qty = Number(qtyEl.value);
    const unit = unitEl.value === "" ? null : Number(unitEl.value);
    const total = totalEl.value === "" ? null : Number(totalEl.value);
    const err = root.querySelector("#buy-error");
    if (!qty || qty < 1 || ((unit == null || Number.isNaN(unit)) && (total == null || Number.isNaN(total)))) {
      err.classList.add("show");
      return;
    }
    let store = storeEl.value;
    if (store === "otro") store = normalizeStoreName(root.querySelector("#buy-store-other").value) || "otro";
    else store = normalizeStoreName(store) || store;
    rememberCustomStore(store);
    const url = (root.querySelector("#buy-url").value || "").trim();
    const item = {
      sku: card.sku,
      qty,
      unit_price: unit,
      total: total != null ? total : (unit != null ? Math.round(unit * qty * 100) / 100 : null),
      store,
      url: url || undefined,
      suggested_qty: suggestedQty(card),
      max_landed: cap != null ? Number(cap) : undefined,
      created_at: existing.created_at || new Date().toISOString(),
      status: "pending",
      source: "pages",
      done_id: id,
      action_key: id
    };
    upsertPurchase(item);
    closeModal();
    const sync = await syncPurchaseToMac(item);
    const saved = markSynced(item, !!(sync.ok && sync.imported));
    lockCard(cardEl, "purchased", { purchase: saved });
    if (activeTab !== TAB_HOY) setActiveTab(TAB_HOY);
  });
  qtyEl.focus();
}

function setActiveTab(next) {
  if (!next || next === activeTab) return;
  activeTab = next;
  try {
    const hash = next === TAB_HOY ? "" : "#" + next;
    history.replaceState(null, "", hash ? hash : (location.pathname + location.search));
  } catch (_) { /* ignore */ }
  if (cachedData) paint(cachedData);
}

function tabFromHash() {
  const h = String(location.hash || "").replace(/^#/, "").toLowerCase();
  if (h === TAB_HALLAZGO || h === "hallazgos") return TAB_HALLAZGO;
  if (h === TAB_QUEUE || h === "queue") return TAB_QUEUE;
  if (h === TAB_DECIDED || h === "decided") return TAB_DECIDED;
  return TAB_HOY;
}

function wireHallazgo(root) {
  root.querySelectorAll("[data-hallazgo-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const next = btn.getAttribute("data-hallazgo-filter") || "ALL";
      if (next === hallazgoFilter) return;
      hallazgoFilter = next;
      if (cachedData) paint(cachedData);
    });
  });
  const search = root.querySelector("#hallazgoSearch");
  if (search) {
    search.addEventListener("input", () => {
      hallazgoQuery = search.value || "";
      if (cachedData) paint(cachedData);
      const again = document.getElementById("hallazgoSearch");
      if (again) {
        again.focus();
        const len = again.value.length;
        try { again.setSelectionRange(len, len); } catch (_) { /* ignore */ }
      }
    });
  }
  document.getElementById("retryHallazgo")?.addEventListener("click", () => { loadHallazgo(); });
  root.querySelectorAll("[data-hallazgo-csv-scope]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const next = btn.getAttribute("data-hallazgo-csv-scope") === "all" ? "all" : "filter";
      if (next === hallazgoCsvScope) return;
      hallazgoCsvScope = next;
      if (cachedData) paint(cachedData);
    });
  });
}

function wire(root) {
  root.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => {
      setActiveTab(btn.getAttribute("data-tab"));
    });
  });
  wireHallazgo(root);
  root.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", async (ev) => {
      const copyBtn = ev.target.closest("button[data-act='copy-ctx']");
      if (copyBtn) {
        const txt = card.getAttribute("data-context") || "";
        try {
          await navigator.clipboard.writeText(txt);
          copyBtn.textContent = "Copiado";
          setTimeout(() => { copyBtn.textContent = "Copiar contexto"; }, 1200);
        } catch (_) {
          copyBtn.textContent = "No se pudo copiar";
          setTimeout(() => { copyBtn.textContent = "Copiar contexto"; }, 1500);
        }
        return;
      }
      const dismissBtn = ev.target.closest("button[data-act='dismiss-pending']");
      if (dismissBtn) {
        dismissLocalPurchase(cardById.get(card.getAttribute("data-done-id")));
        if (cachedData) paint(cachedData);
        return;
      }
      const retryBtn = ev.target.closest("button[data-act='retry-sync']");
      if (retryBtn) {
        const cardObj = cardById.get(card.getAttribute("data-done-id"));
        await retrySyncItem(livePurchaseForCard(cardObj));
        if (cachedData) paint(cachedData);
        return;
      }
      const copyPend = ev.target.closest("button[data-act='copy-pending']");
      if (copyPend) {
        await copyPendingJson();
        copyPend.textContent = "Copiado";
        setTimeout(() => { copyPend.textContent = "Copiar JSON"; }, 1200);
        return;
      }
      const dlPend = ev.target.closest("button[data-act='dl-pending']");
      if (dlPend) {
        downloadText("purchases_pending.json", pendingJsonText(), "application/json");
        return;
      }
      const buyBtn = ev.target.closest("button[data-act='comprar']");
      if (buyBtn && !buyBtn.disabled) {
        openPurchaseModal(card);
        return;
      }
      if (card.getAttribute("data-tab-kind") === "decided") return;
      const doneBtn = ev.target.closest("button[data-act='done']");
      const skipBtn = ev.target.closest("button[data-act='skip']");
      const outBtn = ev.target.closest("button[data-outcome]");
      if (doneBtn && !doneBtn.disabled) {
        card.querySelector("[data-outcomes]")?.classList.toggle("open");
        return;
      }
      if (skipBtn && !skipBtn.disabled) { lockCard(card, "skip"); return; }
      if (outBtn) lockCard(card, outBtn.getAttribute("data-outcome"));
    });
  });
}

function paint(data) {
  rememberRootOffers(data);
  refreshResurgidos(data);
  rememberCards(data);
  const app = document.getElementById("app");
  app.classList.toggle("wide", activeTab === TAB_HALLAZGO);
  app.innerHTML = renderData(data);
  document.title = activeTab === TAB_HALLAZGO ? "Radar de rotación · Hallazgo" : "Radar de rotación · Hoy";
  wire(app);
  document.getElementById("resetHidden")?.addEventListener("click", radarResetHidden);
  document.getElementById("exportCsv")?.addEventListener("click", exportQueueCsv);
  document.getElementById("copyCsv")?.addEventListener("click", copyQueueCsv);
  document.getElementById("exportHallazgoCsv")?.addEventListener("click", exportHallazgoCsv);
  document.getElementById("copyHallazgoCsv")?.addEventListener("click", copyHallazgoCsv);
  document.getElementById("exportHoyCsv")?.addEventListener("click", exportHoyCsv);
  document.getElementById("copyHoyCsv")?.addEventListener("click", copyHoyCsv);
  document.getElementById("exportDecidedCsv")?.addEventListener("click", exportDecidedCsv);
  document.getElementById("copyDecidedCsv")?.addEventListener("click", copyDecidedCsv);
  document.getElementById("importCsv")?.addEventListener("click", () => document.getElementById("importCsvFile")?.click());
  document.getElementById("importCsvFile")?.addEventListener("change", onImportCsvFile);
  wireEstadoImport();
  document.getElementById("retryAllSync")?.addEventListener("click", retryAllPending);
  document.getElementById("copyPendingJson")?.addEventListener("click", copyPendingJson);
  document.getElementById("dlPendingJson")?.addEventListener("click", () => {
    downloadText("purchases_pending.json", pendingJsonText(), "application/json");
  });
}

function radarResetHidden() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("radar-hoy:v1:")) keys.push(k);
  }
  keys.forEach((k) => localStorage.removeItem(k));
  activeTab = TAB_HOY;
  if (cachedData) paint(cachedData);
  else load();
}

async function loadHallazgo() {
  hallazgoStatus = "loading";
  hallazgoError = "";
  try {
    const res = await fetch(HALLAZGO_URL, { cache: "no-store" });
    if (res.status === 404) {
      hallazgoDoc = null;
      hallazgoStatus = "missing";
      return;
    }
    if (!res.ok) throw new Error("No encontré hallazgos_inventario.json");
    const raw = await res.json();
    hallazgoDoc = applyEstadoOverlaysToDoc(normalizeHallazgoDoc(raw));
    hallazgoStatus = "ok";
  } catch (e) {
    hallazgoDoc = null;
    hallazgoStatus = "error";
    hallazgoError = (e && e.message) || "No pude leer el catálogo.";
  } finally {
    if (cachedData) paint(cachedData);
  }
}

async function loadCompanionPending() {
  try {
    const res = await fetch(PENDING_FILE_URL, { cache: "no-store" });
    if (!res.ok) return [];
    const data = await res.json();
    return normalizePendingDoc(data).items;
  } catch (_) {
    return [];
  }
}

async function load() {
  const app = document.getElementById("app");
  activeTab = tabFromHash();
  app.innerHTML = renderLoading();
  loadHallazgo();
  try {
    const res = await fetch(JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("No encontré el archivo del día");
    const data = await res.json();
    const fileItems = await loadCompanionPending();
    hydratePendingFromServer(data, fileItems);
    cachedData = data;
    paint(data);
  } catch (e) {
    app.innerHTML = renderError(e.message || "No pude leer el archivo del día");
    document.getElementById("retry")?.addEventListener("click", load);
  }
}

window.addEventListener("hashchange", () => {
  const next = tabFromHash();
  if (next === activeTab) return;
  activeTab = next;
  if (cachedData) paint(cachedData);
});

load();
</script>
</body>
</html>
