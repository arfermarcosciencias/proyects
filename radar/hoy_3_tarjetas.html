<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f3f7fb"/>
<title>Radar de rotación · Hoy</title>
<link rel="icon" href="./favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" href="./favicon.png"/>
<link rel="icon" type="image/png" href="./icono_radar_rotacion_GO_v2.png"/>
<link rel="apple-touch-icon" href="./icono_radar_rotacion_GO_v2.png"/>
<style>
  :root {
    --bg:#eef2f6; --card:#fff; --text:#0f172a; --muted:#64748b; --muted-2:#94a3b8;
    --evidence:#334155;
    --line:#e2e8f0; --green:#166534; --green-bg:#dcfce7; --blue:#1d4ed8; --blue-bg:#dbeafe;
    --amber:#9a3412; --amber-bg:#ffedd5; --pending:#166534; --pending-bg:#dcfce7;
    --phone:#1e3a5f; --phone-bg:#e8eef6;
    --resurge:#0c4a6e; --resurge-bg:#e0f2fe; --resurge-line:#7dd3fc;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    --wrap:min(1120px, calc(100% - 32px));
    --radius:18px;
    --tap:44px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{width:var(--wrap);max-width:1120px;margin:0 auto;padding:24px 0 56px}
  .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{margin:0 0 8px;font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.03em;font-weight:750}
  .lead{margin:0;font-size:16px;line-height:1.45;color:var(--muted);max-width:62ch}
  .ceiling{margin:8px 0 0;font-size:13px;line-height:1.4;color:var(--muted);font-weight:600}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .tab{appearance:none;border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:10px 16px;min-height:var(--tap);border-radius:999px;cursor:pointer}
  .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
  .stack{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
  .card.done,.card.skipped{opacity:.5}
  .card.pending-buy,.card.registered-buy{opacity:1;box-shadow:0 0 0 2px #bbf7d0, 0 10px 30px rgba(15,23,42,.05)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:750;letter-spacing:.08em;padding:5px 10px;border-radius:999px}
  .badge.BUSCAR{color:#6d28d9;background:#f3e8ff}
  .badge.COMPRAR{color:#166534;background:#dcfce7}
  .badge.REPONER{color:#1d4ed8;background:#dbeafe}
  .badge.ESTRELLA{color:#a16207;background:#fef9c3}
  .badge.CASHFLOW{color:#166534;background:#dcfce7}
  .gate-chip,.pending-chip,.registered-chip,.phone-chip,.offer-chip{
    display:inline-flex;align-items:center;min-height:28px;font-size:12px;font-weight:750;
    padding:4px 10px;border-radius:999px;letter-spacing:.01em;
  }
  .gate-chip{color:var(--amber);background:var(--amber-bg)}
  .pending-chip,.registered-chip{color:var(--pending);background:var(--pending-bg)}
  .phone-chip{color:var(--phone);background:var(--phone-bg)}
  .offer-chip{color:#065f46;background:#d1fae5}
  .resurge-chip{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:var(--tap);min-width:var(--tap);box-sizing:border-box;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:750;
    letter-spacing:.01em;color:var(--resurge);background:var(--resurge-bg);
    border:1px solid var(--resurge-line);
  }
  .techo-block{margin:2px 0 12px}
  .techo-verb{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:2px;letter-spacing:.01em}
  .techo-amount{
    display:block;font-size:clamp(40px,7vw,56px);line-height:.95;font-weight:800;
    letter-spacing:-.045em;color:var(--green);font-variant-numeric:tabular-nums;
  }
  .techo-extra{display:block;margin-top:6px;font-size:13px;font-weight:650;color:var(--muted)}
  .offer-landed{margin:0 0 8px;font-size:14px;line-height:1.4;font-weight:650;color:var(--text)}
  .offer-landed .muted{color:var(--muted);font-weight:600}
  .wrap.wide{max-width:1280px;width:min(1280px, calc(100% - 24px))}
  .hallazgo-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 8px}
  .hallazgo-filters{display:flex;flex-wrap:wrap;gap:8px}
  .hallazgo-search{
    flex:1 1 220px;min-height:var(--tap);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font:inherit;font-size:15px;color:var(--text);background:#fff;
  }
  .hallazgo-meta{margin:0 0 12px;font-size:13px;line-height:1.4;color:var(--muted);font-weight:600}
  .hallazgo-group{margin:18px 0 8px}
  .hallazgo-group h2{
    position:sticky;top:0;z-index:3;margin:0 0 10px;padding:10px 0;
    min-height:var(--tap);display:flex;align-items:center;gap:8px;
    font-size:16px;letter-spacing:-.02em;background:var(--bg);
  }
  .hallazgo-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hallazgo-table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
  .hallazgo-table th{
    text-align:left;font-size:12px;font-weight:750;
    letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
    background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 12px;
  }
  .hallazgo-table td{
    vertical-align:top;padding:14px 12px;border-bottom:1px solid var(--line);
    background:#fff;font-size:14px;line-height:1.4;
  }
  .hallazgo-table tr:hover td{background:#f8fafc}
  .hallazgo-table .h-sku{font-weight:750;white-space:nowrap}
  .hallazgo-table .h-upc{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:650}
  .hallazgo-table .h-name{margin:0 0 6px;font-size:15px;font-weight:750;letter-spacing:-.02em}
  .hallazgo-table .h-why{margin:0;color:var(--muted)}
  .hallazgo-table .h-signal,.hallazgo-table .h-money,.hallazgo-table .h-motor{
    margin:0;font-size:13px;font-weight:650;color:var(--evidence)
  }
  .hallazgo-table .techo-block{margin:0}
  .hallazgo-table .techo-amount{font-size:clamp(28px,3.2vw,40px)}
  .hallazgo-table .techo-empty{color:var(--muted-2);font-size:28px}
  .badge.RECOMPRAR{color:#166534;background:#dcfce7}
  .badge.PRECIO_BUENO{color:#1d4ed8;background:#dbeafe}
  .badge.ESPERAR{color:#334155;background:#e2e8f0}
  .badge.NO{color:#b91c1c;background:#fee2e2}
  .badge.MANUAL{color:#a16207;background:#fef3c7}
  .hallazgo-cards{display:none}
  .hallazgo-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .hallazgo-card .h-name{margin:8px 0;font-size:17px;font-weight:750;letter-spacing:-.02em}
  .hallazgo-card .h-why{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.45}
  .hallazgo-card .h-signal,.hallazgo-card .h-money,.hallazgo-card .h-motor{
    margin:0 0 6px;font-size:13px;font-weight:650;color:var(--evidence)
  }
  .csv-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;
    gap:8px;margin:12px 0 0;overflow:visible;
  }
  .csv-bar .ghost-btn,.csv-bar .csv-copy{
    flex:0 0 auto;min-width:44px;width:auto;white-space:nowrap;
  }
  .csv-copy{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:var(--tap);padding:10px 16px;border-radius:11px;
    font:inherit;font-size:13px;font-weight:750;letter-spacing:.01em;
    background:var(--blue);color:#fff;border:1px solid var(--blue);cursor:pointer;
  }
  .csv-status{margin:0;flex:1 1 100%;font-size:13px;font-weight:650;color:var(--muted)}
  .hallazgo-csv-scope{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .hallazgo-csv-scope .tab{min-width:44px}
  .radar-toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
    z-index:60;background:var(--blue);color:#fff;font-size:14px;font-weight:700;
    padding:12px 16px;border-radius:12px;box-shadow:0 12px 32px rgba(29,78,216,.28);
    max-width:min(92vw,440px);text-align:center;opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
  }
  .radar-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sync-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-width:420px}
  .row{display:flex;gap:16px;align-items:flex-start}
  .photo{width:112px;height:112px;object-fit:cover;border-radius:14px;background:#f1f5f9;flex:0 0 auto}
  .photo.ph{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:8px}
  .copy{min-width:0;flex:1}
  .index{margin:0;font-size:12px;color:var(--muted);font-weight:700}
  .title{
    margin:4px 0 8px;font-size:clamp(17px,1.6vw,20px);line-height:1.3;font-weight:750;letter-spacing:-.02em;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;
    overflow-wrap:break-word;word-break:normal;hyphens:none;
  }
  .qty-advice{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--text)}
  .plata{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--green)}
  .why{margin:0 0 8px;font-size:14px;line-height:1.45;color:var(--muted)}
  .why strong{color:var(--text);font-weight:700}
  .evidence{margin:0 0 10px;font-size:13px;line-height:1.4;color:var(--evidence);font-weight:600}
  .park-meta,.trail{
    margin:0 0 10px;font-size:13px;line-height:1.4;color:var(--muted);
    background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  }
  .trail{color:var(--green);background:#f0fdf4;border-color:#bbf7d0;font-weight:650}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
  .links a,.ghost-btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:10px 14px;border-radius:11px;
    font:inherit;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;flex:0 0 auto;
  }
  .links a.primary{background:var(--blue-bg);color:var(--blue)}
  .links a.secondary,.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .links a.ghost,.ghost-btn{background:#fff;color:var(--blue);border:1px solid var(--line);cursor:pointer}
  .links a.offer-open{background:#ecfdf5;color:#065f46}
  .actions{margin-top:14px;display:grid;grid-template-columns:1.35fr 1fr;gap:10px;max-width:420px}
  .actions.with-comprar{grid-template-columns:1fr;max-width:420px}
  .actions-sub{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
  button{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:12px;padding:12px;font-size:14px;min-height:var(--tap)}
  button:disabled{opacity:.45;cursor:default}
  .btn-primary{background:var(--green-bg);color:var(--green)}
  .btn-comprar{background:var(--green);color:#fff}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .outcomes{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);gap:8px;grid-template-columns:1fr 1fr;max-width:420px}
  .outcomes.open{display:grid}
  .outcomes button{font-size:13px;padding:10px 8px;min-height:var(--tap);background:#f8fafc;border:1px solid var(--line);color:var(--text)}
  .status{margin-top:10px;font-size:13px;color:var(--green);font-weight:700;display:none}
  .status.show{display:block}
  .pending-strip{
    margin-top:18px;background:#fff;border:1px solid #bbf7d0;border-radius:var(--radius);
    padding:14px 16px;box-shadow:0 8px 20px rgba(15,23,42,.04);
  }
  .pending-strip h2{margin:0 0 8px;font-size:15px;letter-spacing:-.02em}
  .pending-strip ul{margin:0;padding:0;list-style:none}
  .pending-strip li{font-size:13px;line-height:1.45;color:var(--evidence);padding:6px 0;border-top:1px solid #ecfdf5}
  .pending-strip li:first-child{border-top:0;padding-top:0}
  .resurgidos-strip{
    margin-top:18px;background:#fff;border:1px solid #ddd6fe;border-radius:var(--radius);
    padding:14px 16px;box-shadow:0 8px 20px rgba(15,23,42,.04);
  }
  .resurgidos-strip h2{margin:0 0 6px;font-size:15px;letter-spacing:-.02em}
  .resurgidos-strip p{margin:0 0 10px;font-size:13px;line-height:1.4;color:var(--muted);font-weight:600}
  .resurgidos-strip ul{margin:0;padding:0;list-style:none}
  .resurgidos-strip li{padding:0}
  .resurge-item{
    display:flex;align-items:center;width:100%;min-height:var(--tap);
    padding:10px 12px;margin:4px 0;border-radius:12px;text-align:left;
    background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe;font-weight:750;cursor:pointer;
  }
  .state{margin-top:14px;background:#fff;border-radius:var(--radius);padding:36px 22px;border:1px solid var(--line);text-align:center}
  .state h2{margin:0 0 8px;font-size:18px}
  .state p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .state .actions{max-width:220px;margin:16px auto 0;grid-template-columns:1fr}
  .skel{border-radius:10px;background:linear-gradient(90deg,#e2e8f0,#f8fafc,#e2e8f0);background-size:200% 100%;animation:sh 1.2s infinite}
  .skel-card{pointer-events:none;box-shadow:none}
  .skel-badge{width:72px;height:22px;border-radius:999px;margin-bottom:12px}
  .skel.photo{flex:0 0 auto}
  .skel-line{height:12px;margin:8px 0}
  .skel-w-sm{width:28%}
  .skel-w-md{width:62%}
  .skel-w-lg{width:92%;height:16px}
  .skel-w{width:74%}
  .skel-tab{display:inline-block;width:132px;height:var(--tap);border-radius:999px}
  .skel-btn{height:var(--tap);width:min(420px,100%);margin-top:14px;border-radius:12px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
  .text-link{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 6px;border:0;background:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer}
  .modal-root[hidden]{display:none}
  .modal-root{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
  .modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.42)}
  .modal{
    position:relative;width:min(520px,100%);max-height:min(92vh,760px);overflow:auto;
    background:#fff;border-radius:20px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(15,23,42,.22);
  }
  .modal h2{margin:0 0 6px;font-size:20px;letter-spacing:-.03em}
  .modal .hint{margin:0 0 14px;font-size:13px;line-height:1.45;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
  .field[hidden]{display:none}
  .field label{font-size:13px;font-weight:700;color:var(--text)}
  .field input,.field select,.field textarea{
    min-height:var(--tap);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font:inherit;font-size:15px;color:var(--text);background:#fff;
  }
  .field textarea{min-height:160px;font-size:13px;resize:vertical;line-height:1.4}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:8px}
  .modal-error{display:none;margin:0 0 10px;font-size:13px;font-weight:700;color:#b91c1c}
  .modal-error.show{display:block}
  @media (max-width:479px){
    .row{flex-direction:column}
    .photo{width:96px;height:96px}
    .links{flex-direction:column;align-items:stretch}
    .links a,.ghost-btn{width:100%}
    .csv-bar .ghost-btn,.csv-bar .csv-copy{width:auto;min-width:44px}
    .actions,.outcomes,.actions-sub{max-width:none}
    .field-row{grid-template-columns:1fr}
  }
  @media (max-width:819px){
    .hallazgo-scroll{overflow:visible}
    .hallazgo-table{display:none;min-width:0}
    .hallazgo-cards{display:grid;gap:12px}
    .hallazgo-card .techo-amount{font-size:clamp(36px,8vw,48px)}
  }
  @media (min-width:640px){
    .modal-root{align-items:center}
  }
  @media (min-width:820px){
    .wrap{padding:32px 0 72px}
    .stack{grid-template-columns:1fr 1fr;gap:18px}
    .stack.one-col{grid-template-columns:1fr;max-width:720px}
    .card{padding:20px}
    .photo{width:128px;height:128px}
  }
  @media (min-width:1100px){
    .stack{grid-template-columns:1fr 1fr;gap:20px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal-root" id="modal-root" hidden></div>
<script>
const JSON_URL = "./hoy_3_tarjetas.json";

  { key: "outcome", header: "outcome" },
  { key: "park_note", header: "park_note" },
  { key: "hide_until", header: "hide_until" }
]);

  purchased: "Anotado como comprado",

};

  pause: "pausada",
  paused: "pausada",

  skipped: "saltada",
  done: "hecha",
  purchased: "comprada",
  not_found: "no encontrada",

  dismiss: "descartada",

  hidden: "oculta",
  queue: "en cola",
  active: "activa",
  resurgido: "Resurgido",
  nunca: "nunca"
};

];

let cachedData = null;
let activeTab = TAB_HOY;
let cardById = new Map();

let lastFocus = null;

let hallazgoStatus = "idle";
let hallazgoError = "";

const money0 = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(Number(n));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey = (id) => `radar-hoy:v1:${id}`;

function asText(v) {
  if (v == null) return "";
  if (typeof v === "string") return v.trim();
  if (typeof v === "object") {
    for (const k of ["detail", "text", "why_line", "por_que", "summary", "label"]) {
      if (typeof v[k] === "string" && v[k].trim()) return v[k].trim();
    }
  }
  return "";
}

function localizeToken(s) {
  const raw = String(s ?? "").trim();
  if (!raw) return "";
  const key = raw.toLowerCase().replace(/[\s-]+/g, "_");
  if (STATUS_TEXT[key]) return STATUS_TEXT[key];
  if (OUTCOME_TEXT[key]) return OUTCOME_TEXT[key];
  return raw.replace(/\bpaused\b/gi, "pausada").replace(/\bpause\b/gi, "pausada");
}

function looksTruncatedTitle(s) {
  const t = String(s || "").trim();
  if (!t) return true;
  if (/[…]$/.test(t) || /\s[A-Za-zÁÉÍÓÚÜáéíóúü]{1,3}$/.test(t)) return true;
  if (/^Busca proveedor/i.test(t)) return true;
  return false;
}

function nameFromContext(card) {
  const ctx = asText(card.contexto_prompt);
  const m = ctx.match(/Producto:\s*([^\n]+)/i);
  return m ? m[1].replace(/\s+/g, " ").trim() : "";
}

function nameFromPorQue(card) {
  const src = asText(card.por_que) || asText(card.why_line);
  const m = src.match(/·\s*([^:]+?)(?::|$)/);
  if (!m) return "";
  return m[1].replace(/[.…]+$/g, "").replace(/\s+-\s*$/g, "").trim();
}

function productName(card) {
  const t = (card.title || "").trim();
  const generic = !t || /^Busca proveedor/i.test(t) || (/^Compra\s+\d+/i.test(t) && t.length < 28);
  if (!generic && !looksTruncatedTitle(t)) return t;
  return nameFromContext(card) || nameFromPorQue(card) || t.replace(/^Busca proveedor\s*·\s*/i, "").trim() || card.sku || "este producto";
}

function cardAction(card) {
  return String((card && (card.action || card.tipo)) || "").toUpperCase();
}

function isGateOk(card) {
  if (!card) return false;
  if (typeof card.gate_ok === "boolean") return card.gate_ok;
  return cardAction(card) === "COMPRAR";
}

function showComprarCta(card) {
  if (!card) return false;
  if (card.gate_ok === true) return true;
  if (card.gate_ok == null && cardAction(card) === "COMPRAR") return true;
  return false;
}

function gateReason(card) {
  const raw = asText(card && card.gate_reason_es);
  if (raw) return raw;
  const codes = Array.isArray(card && card.gate_codes) ? card.gate_codes : [];
  if (codes.includes("sin_margen")) return "Sin margen";
  if (codes.includes("bajo_120")) return "Gana menos de $120";
  if (codes.includes("roi_bajo_30")) return "ROI bajo 30%";
  return "";
}

function isHoyExecutable(card) {
  if (!card) return false;
  if (card.gate_ok === false) return false;
  return true;
}

function parseContextMoney(card) {
  const ctx = asText(card && card.contexto_prompt);
  const um = ctx.match(/Utilidad est\.\s*\/\s*u:\s*\$?\s*([\d.]+)/i);
  const roi = ctx.match(/ROI:\s*([\d.]+)\s*%/i);
  const mg = ctx.match(/margen u:\s*\$?\s*([\d.]+)/i);
  return {
    gain: um ? Number(um[1]) : null,
    roi: roi ? Number(roi[1]) : null,
    margen: mg ? Number(mg[1]) : null
  };
}

function estimatedGain(card) {
  if (!card) return null;
  for (const v of [card.ganancia_estimada_mxn, card.unit_margin, card.evidence && card.evidence.unit_margin]) {
    if (v != null && !Number.isNaN(Number(v))) return Number(v);
  }
  const parsed = parseContextMoney(card).gain;
  return parsed != null && !Number.isNaN(parsed) ? parsed : null;
}

function estimatedRoi(card) {
  if (!card) return null;
  if (card.roi_pct != null && !Number.isNaN(Number(card.roi_pct))) return Number(card.roi_pct);
  const parsed = parseContextMoney(card).roi;
  return parsed != null && !Number.isNaN(parsed) ? parsed : null;
}

function estimatedMargin(card) {
  if (!card) return null;
  for (const v of [card.unit_margin, card.margen_u, card.margen, card.evidence && card.evidence.unit_margin]) {
    if (v != null && !Number.isNaN(Number(v))) return Number(v);
  }
  const parsed = parseContextMoney(card).margen;
  if (parsed != null && !Number.isNaN(parsed)) return parsed;
  return estimatedGain(card);
}

function normTag(v) {
  return String(v || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
}

function pushTags(out, v) {
  if (v == null || v === "") return;
  if (Array.isArray(v)) {
    v.forEach((item) => pushTags(out, item));
    return;
  }
  if (typeof v === "object") {
    for (const k of ["tag", "status", "id", "label", "value", "outcome", "reason"]) pushTags(out, v[k]);
    return;
  }
  const t = normTag(v);
  if (t) out.push(t);
}

function collectCardTags(card) {
  const out = [];
  if (!card) return out;
  pushTags(out, card.tag);
  pushTags(out, card.tags);
  pushTags(out, card.status);
  pushTags(out, card.reason);
  pushTags(out, card.outcome);
  const st = readState(cardId(card));
  if (st) {
    pushTags(out, st.tag);
    pushTags(out, st.tags);
    pushTags(out, st.status);
    pushTags(out, st.outcome);
  }
  return out;
}

function hasNuncaTag(card) {
  return collectCardTags(card).some((t) => t === "nunca" || t === "never");
}

function withinLastDays(iso, days) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return false;
  return (Date.now() - t) <= days * 86400000;
}

function descartadoWithin30d(card) {
  const days = DESCARTADO_BLOCK_DAYS;
  const st = readState(cardId(card));
  if (st && normTag(st.outcome) === "descartado") {
    if (st.created_at && withinLastDays(st.created_at, days)) return true;
    if (st.hide_until && Date.parse(st.hide_until) > Date.now()) return true;
    if (!st.created_at && !st.hide_until) return true;
    if (st.hide_until) {
      const start = Date.parse(st.hide_until) - (Number(st.hide_days) || days) * 86400000;
      if (!Number.isNaN(start) && (Date.now() - start) <= days * 86400000) return true;
    }
  }
  if (normTag(card && card.outcome) === "descartado") {
    if (card.hide_until && Date.parse(card.hide_until) > Date.now()) return true;
    if (card.descartado_at && withinLastDays(card.descartado_at, days)) return true;
    if (!card.hide_until && !card.descartado_at) return true;
  }
  for (const a of (readInbox().actions || [])) {
    if (asText(a.sku) === asText(card && card.sku) && normTag(a.outcome) === "descartado" && withinLastDays(a.created_at, days)) {
      return true;
    }
  }
  return false;
}

function localOutcome(card) {
  const st = readState(cardId(card));
  return normTag(st && st.outcome) || normTag(card && card.outcome);
}

function isOperatorPaused(card) {
  const reason = normTag(card && card.reason);
  if (reason === "pause" || reason === "paused" || reason === "pausada") return true;
  const outcome = localOutcome(card);
  if (outcome === "skip" || outcome === "tomorrow" || outcome === "not_found") return true;
  const note = asText(card && card.park_note).toLowerCase();
  return /operador|pausa/.test(note);
}

function pauseReasonBlob(card) {
  return [
    asText(card && card.park_note),
    asText(card && card.reason),
    asText(card && card.gate_reason_es),
    Array.isArray(card && card.gate_codes) ? card.gate_codes.join(" ") : "",
    asText(card && card.por_que),
    asText(card && card.why_line)
  ].join(" ").toLowerCase();
}

function cardPayout(card) {
  if (!card || typeof card !== "object") return null;
  const bags = [card, card.economics, card.evidence];
  const keys = ["payout", "payout_mxn", "net_payout", "net_payout_mxn"];
  for (const bag of bags) {
    if (!bag || typeof bag !== "object") continue;
    for (const k of keys) {
      const n = parseMoney(bag[k]);
      if (n != null && n > 0) return n;
    }
  }
  const util = estimatedGain(card);
  const techo = capAmount(card);
  if (util != null && techo != null) return util + techo;
  return null;
}

function offerFoundLanded(card, offer) {
  const o = offer || cardExternalOffer(card);
  if (!o) return null;
  const n = parseMoney(firstDefined(o.found_landed, o.found_landed_cost_mxn));
  return n != null && n > 0 ? n : null;
}

function resurgeEconomics(card, offer) {
  const landed = offerFoundLanded(card, offer);
  const payout = cardPayout(card);
  if (landed != null && payout != null) {
    const util = payout - landed;
    const roi = landed > 0 ? (util / landed) * 100 : null;
    return { util, roi, margen: util, landed, payout, from_landed: true };
  }
  return {
    util: estimatedGain(card),
    roi: estimatedRoi(card),
    margen: estimatedMargin(card),
    landed,
    payout,
    from_landed: false
  };
}

function passesResurgeNumbers(card, offer) {
  const eco = resurgeEconomics(card, offer || cardExternalOffer(card));
  const util = eco.util;
  const roi = eco.roi;
  const margen = eco.margen;
  const utilOk = util != null && util >= RESURGIDO_UTIL_MIN;
  const roiOk = roi != null && roi >= RESURGIDO_ROI_MIN;
  const margenOk = margen != null && margen > 0;
  if (utilOk && roiOk && margenOk) return true;
  if (eco.from_landed) return false;
  if (card && card.gate_ok === true) {
    if (util != null && util < RESURGIDO_UTIL_MIN) return false;
    if (roi != null && roi < RESURGIDO_ROI_MIN) return false;
    if (margen != null && !(margen > 0)) return false;
    return true;
  }
  return false;
}

function offerCuresPause(card, offer) {
  if (!isOfertaEncontrada(offer)) return false;
  const blob = pauseReasonBlob(card);
  const note = asText(card && card.park_note).toLowerCase();
  const genericOp = !note || /pausa por el operador|en pausa|pausad/.test(note);
  const offerRelated = /buy path|proveedor|agotado|techo|precio|oferta|landed|sin oferta|no hay/.test(blob);
  const gateRelated = (Array.isArray(card && card.gate_codes) && card.gate_codes.length > 0)
    || /gana menos|roi bajo|sin margen/.test(blob);
  if (!genericOp && !offerRelated && !gateRelated) return false;
  const cap = offerCap(card, offer);
  if (offer.found_landed != null && cap != null && offer.found_landed > cap) return false;
  if (gateRelated && !passesResurgeNumbers(card, offer)) return false;
  return true;
}

function canResucitar(card) {
  if (!card) return { ok: false, why: "sin_tarjeta" };
  if (hasNuncaTag(card)) return { ok: false, why: "nunca" };
  if (descartadoWithin30d(card)) return { ok: false, why: "descartado_30d" };
  const offer = cardExternalOffer(card);
  if (!isOfertaEncontrada(offer)) return { ok: false, why: "sin_oferta" };
  const cap = offerCap(card, offer);
  if (offer.found_landed != null && cap != null && offer.found_landed > cap) {
    return { ok: false, why: "sobre_techo" };
  }
  if (!passesResurgeNumbers(card, offer)) return { ok: false, why: "piso" };
  const paused = isOperatorPaused(card);
  const cured = paused && offerCuresPause(card, offer);
  if (paused && !cured) return { ok: false, why: "pausa_no_curada" };
  return { ok: true, offer, paused, cured };
}

function prevStateOf(card, paused) {
  return paused || isOperatorPaused(card) ? "paused" : "dismissed";
}

function emptyResurgidosDoc() {
  return { schema: "arfershop.radar.resurgidos.v1", updated_at: null, resurgidos: [] };
}

function readResurgidosDoc() {
  try {
    const raw = JSON.parse(localStorage.getItem(RESURGIDOS_KEY) || "null");
    if (raw && Array.isArray(raw.resurgidos)) return raw;
    if (raw && Array.isArray(raw.items)) return { ...raw, resurgidos: raw.items };
  } catch { /* ignore */ }
  return emptyResurgidosDoc();
}

function writeResurgidosDoc(doc) {
  const next = {
    schema: "arfershop.radar.resurgidos.v1",
    updated_at: new Date().toISOString(),
    resurgidos: Array.isArray(doc && doc.resurgidos) ? doc.resurgidos : []
  };
  localStorage.setItem(RESURGIDOS_KEY, JSON.stringify(next));
  return next;
}

function truthyFlag(v) {
  if (v === true || v === 1) return true;
  const t = normTag(v);
  return t === "true" || t === "1" || t === "yes" || t === "si";
}

function rootResurgidos(data) {
  const raw = data && data.resurgidos;
  return Array.isArray(raw) ? raw : [];
}

function resurgidoRowForSku(sku, data) {
  const key = asText(sku);
  if (!key) return null;
  if (resurgidoBySku.has(key)) return resurgidoBySku.get(key);
  const bags = [
    ...rootResurgidos(data || cachedData),
    ...((readResurgidosDoc().resurgidos) || [])
  ];
  return bags.find((x) => asText(x && x.sku) === key && (!x.status || normTag(x.status) === "resurgido")) || null;
}

function cardLooksResurgido(card) {
  if (!card) return false;
  if (truthyFlag(card.resurgido) || truthyFlag(card["data-resurgido"])) return true;
  if (normTag(card.status) === "resurgido" || normTag(card.tag) === "resurgido") return true;
  return false;
}

function isResurgido(card) {
  if (!card) return false;
  if (cardLooksResurgido(card)) return true;
  const sku = asText(card.sku);
  if (sku && resurgidoBySku.has(sku)) return true;
  const root = rootResurgidos(cachedData);
  return !!(sku && root.some((x) => asText(x && x.sku) === sku && (!x.status || normTag(x.status) === "resurgido")));
}

function decidedSource(data) {
  if (Array.isArray(data && data.dismissed_or_paused)) return data.dismissed_or_paused;
  if (Array.isArray(data && data.parked)) return data.parked;
  return [];
}

function hasLocalDecision(card) {
  const st = readState(cardId(card));
  if (!st) return false;
  if (normTag(st.outcome) === "purchased") return false;
  if (isHidden(st, card)) return true;
  return !!normTag(st.outcome);
}

function resurgidoCandidates(data) {
  const seen = new Set();
  const out = [];
  const push = (card) => {
    if (!card || typeof card !== "object") return;
    const key = cardKey(card);
    if (!key || seen.has(key)) return;
    seen.add(key);
    out.push(card);
  };
  for (const card of decidedSource(data)) push(card);
  for (const list of [(data && data.cards) || [], (data && data.queue) || []]) {
    for (const card of list) {
      if (hasLocalDecision(card)) push(card);
    }
  }
  return out;
}

function allCardBags(data) {
  return [
    ...((data && data.cards) || []),
    ...((data && data.queue) || []),
    ...decidedSource(data),
    ...((data && data.parked) || [])
  ];
}

function findCardForResurge(data, row) {
  const sku = asText(row && row.sku);
  const done = asText(row && row.done_id);
  if (!sku && !done) return null;
  for (const c of allCardBags(data)) {
    if (done && cardId(c) === done) return c;
    if (sku && asText(c.sku) === sku) return c;
  }
  return null;
}

function clearHideForResurgido(card) {
  if (!card || typeof card !== "object") return;
  card.hide_until = null;
  const id = cardId(card);
  if (!id) return;
  const st = readState(id);
  if (!st) return;
  if (st.hide_until || st.hide_days) {
    writeState({ ...st, hide_until: null, hide_days: 0, resurgido: true, status: RESURGIDO });
  }
}

function stampResurgidoCard(card, row) {
  if (!card || typeof card !== "object") return;
  card.status = RESURGIDO;
  card.tag = RESURGIDO;
  card.resurgido = true;
  card.resurrected_at = row.resurrected_at;
  card.resurrect_reason = row.resurrect_reason || "gate_ok_post_import";
  if (row.prev_state) card.prev_state = row.prev_state;
  if (row.cured_pause_reason != null) card.cured_pause_reason = !!row.cured_pause_reason;
  if (row.util != null) card.util_post = row.util;
  if (row.roi != null) card.roi_post = row.roi;
  if (row.util_post != null) card.util_post = row.util_post;
  if (row.roi_post != null) card.roi_post = row.roi_post;
  clearHideForResurgido(card);
}

function refreshResurgidos(data) {
  const prev = new Map((readResurgidosDoc().resurgidos || []).map((x) => [asText(x && x.sku), x]));
  const items = [];
  const seen = new Set();
  if (!data) {
    resurgidoBySku = new Map();
    return items;
  }

  function add(card, seed, verdict) {
    const sku = asText((card && card.sku) || (seed && seed.sku));
    if (!sku || seen.has(sku)) return;
    seen.add(sku);
    const old = prev.get(sku) || seed || {};
    const offer = (verdict && verdict.offer) || (card && cardExternalOffer(card));
    const resurrected_at = old.resurrected_at || (seed && seed.resurrected_at) || new Date().toISOString();
    const resurrect_reason = old.resurrect_reason || (seed && seed.resurrect_reason) || "gate_ok_post_import";
    const paused = !!(verdict && verdict.paused) || isOperatorPaused(card);
    const prev_state = (seed && seed.prev_state) || old.prev_state || prevStateOf(card, paused);
    const cured_pause_reason = seed && seed.cured_pause_reason != null
      ? !!seed.cured_pause_reason
      : (verdict ? !!verdict.cured : !!old.cured_pause_reason);
    const found_landed = (seed && seed.found_landed != null)
      ? seed.found_landed
      : (offer && offer.found_landed != null ? offer.found_landed : old.found_landed);
    const eco = resurgeEconomics(card, offer);
    const util = eco.util != null ? eco.util : (seed && seed.util != null ? seed.util : old.util);
    const roi = eco.roi != null ? eco.roi : (seed && seed.roi != null ? seed.roi : old.roi);
    const row = {
      sku,
      status: RESURGIDO,
      resurrected_at,
      util,
      roi,
      util_post: util,
      roi_post: roi,
      resurrect_reason,
      prev_state,
      cured_pause_reason
    };
    const doneId = (card && cardId(card)) || asText(seed && seed.done_id);
    if (doneId) row.done_id = doneId;
    if (found_landed != null) row.found_landed = found_landed;
    if (card) stampResurgidoCard(card, row);
    items.push(row);
  }

  for (const row of rootResurgidos(data)) {
    if (!row || (row.status && normTag(row.status) !== "resurgido")) continue;
    add(findCardForResurge(data, row), row, null);
  }
  for (const card of allCardBags(data)) {
    if (cardLooksResurgido(card)) add(card, prev.get(asText(card.sku)), null);
  }
  for (const card of resurgidoCandidates(data)) {
    const verdict = canResucitar(card);
    if (verdict.ok) add(card, prev.get(asText(card.sku)), verdict);
  }

  writeResurgidosDoc({ resurgidos: items });
  resurgidoBySku = new Map(items.map((x) => [x.sku, x]));
  if (data && typeof data === "object") data.resurgidos = items;
  return items;
}

function verbTitle(card) {
  const name = productName(card);
  const n = Number(card.qty) || 1;
  if (cardAction(card) === "BUSCAR") {
    return n === 1 ? `Busca quién te venda ${name}` : `Busca quién te venda ${name} (${n} piezas)`;
  }
  return n === 1 ? `Compra ${name}` : `Compra ${n} de ${name}`;
}

function plataLine(card) {
  const g = estimatedGain(card);
  if (g == null) return null;
  return `~gánele ${money0(g)}`;
}

function capAmount(card) {
  const cap = card && (card.max_landed_cost != null ? card.max_landed_cost : card.alert_price);
  if (cap == null || Number.isNaN(Number(cap)) || Number(cap) <= 0) return null;
  return Number(cap);
}

function compraSiNoPasa(card) {
  const cap = capAmount(card);
  return cap == null ? "" : `Compra solo si no pasa de ${money0(cap)}`;
}

function parseMoney(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  const cleaned = String(v).trim().replace(/[$MXN\s]/gi, "").replace(/,/g, "");
  if (!cleaned) return null;
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : null;
}

function firstDefined(...vals) {
  for (const v of vals) {
    if (v != null && v !== "") return v;
  }
  return undefined;
}

function offerStatus(raw) {
  return String(raw || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
}

function pickOfferObject(card) {
  if (!card || typeof card !== "object") return null;
  const bags = [card.external_offer, card.external_offers, card.externalOffer, card.externalOffers];
  for (const bag of bags) {
    if (Array.isArray(bag)) {
      const found = bag.find((o) => o && typeof o === "object" && offerStatus(o.status) === OFFER_FOUND);
      if (found) return found;
      if (bag[0] && typeof bag[0] === "object") return bag[0];
    } else if (bag && typeof bag === "object") {
      return bag;
    }
  }
  return null;
}

function computeFoundLanded(offer) {
  if (!offer) return null;
  const direct = parseMoney(firstDefined(offer.found_landed, offer.found_landed_cost_mxn));
  if (direct != null) return direct;
  const item = parseMoney(firstDefined(offer.item_price, offer.found_product_price_mxn));
  const ship = parseMoney(firstDefined(offer.shipping, offer.found_shipping_mxn));
  const fees = parseMoney(firstDefined(offer.fees, offer.found_import_fees_mxn, offer.found_other_mandatory_costs_mxn));
  if (item == null && ship == null && fees == null) return null;
  return (item || 0) + (ship || 0) + (fees || 0);
}

function normalizeExternalOffer(raw, card) {
  if (!raw || typeof raw !== "object") return null;
  const status = offerStatus(raw.status);
  const found_url = asText(firstDefined(raw.found_url, raw.url, raw.offer_url));
  const store = asText(firstDefined(raw.store, raw.found_supplier, raw.tienda));
  const found_landed = computeFoundLanded(raw);
  if (!status && !found_url && found_landed == null && !store) return null;
  const qty = Number(firstDefined(raw.suggested_qty, raw.qty));
  return {
    offer_id: asText(raw.offer_id) || undefined,
    export_id: asText(raw.export_id) || undefined,
    sku: asText(raw.sku) || (card && asText(card.sku)) || undefined,
    status: status || undefined,
    found_url: found_url || undefined,
    store: store || undefined,
    item_price: parseMoney(firstDefined(raw.item_price, raw.found_product_price_mxn)),
    shipping: parseMoney(firstDefined(raw.shipping, raw.found_shipping_mxn)),
    fees: parseMoney(firstDefined(raw.fees, raw.found_import_fees_mxn)),
    found_landed,
    currency: asText(raw.currency) || "MXN",
    max_landed_at_import: parseMoney(firstDefined(raw.max_landed_at_import, raw.max_landed)),
    below_limit_mxn: parseMoney(raw.below_limit_mxn),
    suggested_qty: Number.isFinite(qty) && qty >= 1 ? qty : undefined,
    imported_at: asText(firstDefined(raw.imported_at, raw.found_checked_at)) || undefined
  };
}

function readOfferOverlays() {
  try {
    const raw = JSON.parse(localStorage.getItem(OFFER_KEY) || "null");
    if (raw && raw.by_sku && typeof raw.by_sku === "object") return raw.by_sku;
    if (raw && typeof raw === "object" && !Array.isArray(raw)) return raw;
  } catch { /* ignore */ }
  return {};
}

function writeOfferOverlays(bySku) {
  localStorage.setItem(OFFER_KEY, JSON.stringify({
    schema: "arfershop.radar.external_offer.v1",
    updated_at: new Date().toISOString(),
    by_sku: bySku || {}
  }));
}

function rootActiveOffers(data) {
  const raw = data && data.external_offers_active;
  return Array.isArray(raw) ? raw : [];
}

function cardExternalOffer(card) {
  const embedded = normalizeExternalOffer(pickOfferObject(card), card);
  if (embedded) return embedded;
  const sku = card && asText(card.sku);
  if (!sku) return null;
  const fromRoot = offerBySku.get(sku);
  if (fromRoot) return normalizeExternalOffer(fromRoot, card);
  return normalizeExternalOffer(readOfferOverlays()[sku], card);
}

function isOfertaEncontrada(offer) {
  return !!offer && offerStatus(offer.status) === OFFER_FOUND;
}

function offerCap(card, offer) {
  const cap = capAmount(card);
  if (cap != null) return cap;
  if (offer && offer.max_landed_at_import != null) return offer.max_landed_at_import;
  return null;
}

function offerLandedHtml(card, offer) {
  if (!isOfertaEncontrada(offer)) return "";
  const landed = offer.found_landed;
  const cap = offerCap(card, offer);
  if (landed == null && !offer.store) return "";
  const bits = [];
  if (landed != null) bits.push(`Precio encontrado / landed: ${money0(landed)}`);
  if (cap != null) bits.push(`techo ${money0(cap)}`);
  if (offer.store) bits.push(offer.store);
  return `<p class="offer-landed">${esc(bits[0] || "")}${bits.length > 1 ? ` <span class="muted">· ${esc(bits.slice(1).join(" · "))}</span>` : ""}</p>`;
}

function techoExtra(card) {
  const g = estimatedGain(card);
  const r = estimatedRoi(card);
  if (g != null && r != null) return `ganas ~${money0(g)} (ROI ~${Number(r).toFixed(0)}%)`;
  if (g != null) return `ganas ~${money0(g)}`;
  if (r != null) return `mantén un ROI de ~${Number(r).toFixed(0)}%`;
  return "";
}

function techoHtml(card) {
  const cap = capAmount(card);
  const extra = techoExtra(card);
  if (cap == null) {
    const plata = plataLine(card);
    return plata ? `<p class="plata">${esc(plata)}</p>` : "";
  }
  return `<p class="techo-block"><span class="techo-verb">Compra solo si no pasa de</span><span class="techo-amount">${esc(money0(cap))}</span>${extra ? `<span class="techo-extra">${esc(extra)}</span>` : ""}</p>`;
}

function suggestedQty(card) {
  const n = Number(card.qty_si_techo != null ? card.qty_si_techo : card.qty);
  return (!n || Number.isNaN(n) || n < 1) ? 1 : n;
}

function qtyAdviceLine(card) {
  const n = suggestedQty(card);
  const piezas = n === 1 ? "1 pieza" : n + " piezas";
  return "Compra " + piezas + " solo si no se pasa de ese precio";
}

function whyText(card) {
  const candidates = [card.why && card.why.detail, card.why_line, asText(card.why), card.por_que, card.contexto_prompt];
  for (const raw of candidates) {
    let s = asText(raw);
    if (!s) continue;
    if (/\bsoh\b|\btecho\b|\d+d\s*\/|buy path|\[object Object\]/i.test(s)) continue;
    s = s.replace(/\bsin buy path\b/gi, "")
         .replace(/\bagotado el canal\b/gi, "")
         .replace(/\bbuen historial\b/gi, "")
         .replace(/\bVuelve a buscar proveedor de[^:]+:\s*/i, "")
         .replace(/\btecho\b/gi, "")
         .replace(/\s*\/\s*/g, " ")
         .replace(/\s{2,}/g, " ")
         .trim();
    if (s.length >= 12 && s.length < 220) return s.charAt(0).toUpperCase() + s.slice(1);
  }
  const ev = card.evidence || {};
  const bits = [];
  if (ev.soh === 0 || card.soh === 0) bits.push("se te acabó");
  const s30 = ev.sales_30 != null ? ev.sales_30 : card.sales_30;
  const s90 = ev.sales_90 != null ? ev.sales_90 : card.sales_90;
  if ((s30 || 0) > 0 || (s90 || 0) > 0) bits.push("se vende de vez en cuando");
  if (cardAction(card) === "BUSCAR") bits.push("hay que buscar proveedor");
  if (bits.length) return bits.slice(0, 2).join(" y ") + ".";
  return "Vale la pena checarlo si encuentras buen precio.";
}

function evidenceLine(ev) {
  if (!ev) return "";
  const a = [];
  if (ev.sales_30 != null) a.push(`${ev.sales_30} en 30d`);
  if (ev.sales_90 != null) a.push(`${ev.sales_90} en 90d`);
  if (ev.soh != null) a.push(`existencias ${ev.soh}`);
  if (ev.days_since_last_sale != null) a.push(`última venta hace ${ev.days_since_last_sale}d`);
  if (ev.unit_margin != null) a.push(`margen ~${money0(ev.unit_margin)}`);
  return a.join(" · ");
}

function looksLikeUpc(s) {
  const t = String(s || "").trim();
  if (!t || t.length < 6 || t.length > 14) return false;
  return /^[0-9]{8,14}$/.test(t) || /^ARF[A-Z0-9]{4,11}$/i.test(t);
}

function cardUpc(card) {
  if (!card) return "";
  for (const key of ["upc", "ean", "gtin", "barcode", "upc_ean"]) {
    const v = asText(card[key]);
    if (looksLikeUpc(v)) return v;
  }
  const blob = [card.prompt_alerta, card.contexto_prompt, card.shopping_url].map(asText).join("\n");
  const labeled = blob.match(/UPC disponible[^:\n]*:\s*([A-Z0-9]{6,14})/i)
    || blob.match(/\bUPC[:\s]+([A-Z0-9]{6,14})/i);
  if (labeled && looksLikeUpc(labeled[1])) return labeled[1];
  const fromShop = String(card.shopping_url || "").match(/[?&]q=([^&]+)/i);
  if (fromShop) {
    const q = decodeURIComponent(fromShop[1].replace(/\+/g, " ")).trim();
    const last = q.split(/\s+/).pop();
    if (looksLikeUpc(q)) return q;
    if (looksLikeUpc(last)) return last;
  }
  return "";
}

function shoppingHref(card, name) {
  if (card.shopping_url) return card.shopping_url;
  const upc = cardUpc(card);
  if (upc) return "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(upc);
  return "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(name);
}

function shoppingLabel(card) {
  if (asText(card && card.upc) || cardUpc(card)) return "Busca por UPC";
  return card.shopping_label || "Busca precio";
}

function mlHref(card, name) {
  if (card.marketplace_url) return card.marketplace_url;
  if (card.meli_id) return "https://www.mercadolibre.com.mx/p/" + encodeURIComponent(card.meli_id);
  return "https://listado.mercadolibre.com.mx/" + encodeURIComponent(name).replace(/%20/g, "-");
}

function contextText(card) {
  return asText(card.contexto_prompt) || asText(card.why_line) || asText(card.por_que) || asText(card.why) || "";
}

function keepaHref(card) {
  const asin = (card.asin || "").trim();
  if (!asin) return null;
  return "https://keepa.com/#!product/11-" + encodeURIComponent(asin);
}

function storeLinks(card) {
  const arr = Array.isArray(card.marketplace_urls) ? card.marketplace_urls : [];
  return arr.map((u) => {
    if (typeof u === "string" && /^https?:\/\//i.test(u)) return { label: "Abrir tienda", url: u };
    if (u && typeof u === "object" && /^https?:\/\//i.test(u.url || "")) {
      return { label: u.label || "Abrir tienda", url: u.url };
    }
    return null;
  }).filter(Boolean);
}

function cardId(card) {
  return String((card && (card.done_id || card.sku)) || "");
}

function readState(id) {
  if (!id) return null;
  try { return JSON.parse(localStorage.getItem(storeKey(id)) || "null"); } catch { return null; }
}

function writeState(obj) {
  if (!obj || !obj.done_id) return;
  localStorage.setItem(storeKey(obj.done_id), JSON.stringify(obj));
}

function emptyPendingDoc() {
  return { schema: "arfershop.radar.purchases_pending.v1", updated_at: null, items: [] };
}

function normalizePendingDoc(raw) {
  if (Array.isArray(raw)) return { schema: "arfershop.radar.purchases_pending.v1", updated_at: null, items: raw };
  if (raw && Array.isArray(raw.items)) {
    return {
      schema: raw.schema || "arfershop.radar.purchases_pending.v1",
      updated_at: raw.updated_at || null,
      items: raw.items
    };
  }
  return emptyPendingDoc();
}

function readPending() {
  try {
    const raw = JSON.parse(localStorage.getItem(PENDING_KEY) || "null");
    if (raw) return normalizePendingDoc(raw);
  } catch { /* ignore */ }
  return emptyPendingDoc();
}

function writePending(doc) {
  const next = normalizePendingDoc(doc);
  next.updated_at = new Date().toISOString();
  next.schema = "arfershop.radar.purchases_pending.v1";
  localStorage.setItem(PENDING_KEY, JSON.stringify(next));
  rememberStoresFromItems(next.items);
  return next;
}

function emptyPrefs() {
  return { custom_stores: [] };
}

function readPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
    if (Array.isArray(raw)) return { custom_stores: raw };
    if (raw && typeof raw === "object") {
      const list = Array.isArray(raw.custom_stores) ? raw.custom_stores : [];
      return { ...raw, custom_stores: list };
    }
  } catch { /* ignore */ }
  return emptyPrefs();
}

function writePrefs(prefs) {
  const next = prefs && typeof prefs === "object" ? prefs : emptyPrefs();
  if (!Array.isArray(next.custom_stores)) next.custom_stores = [];
  localStorage.setItem(PREFS_KEY, JSON.stringify(next));
  return next;
}

function isDefaultStoreName(name) {
  const key = String(name || "").trim().toLowerCase();
  return !key || key === "otro" || key === "otra" || key === "amazon" || key === "ml" || key === "mercado libre";
}

function readCustomStores() {
  return readPrefs().custom_stores
    .map((s) => String(s || "").trim())
    .filter((s) => s && !isDefaultStoreName(s));
}

function rememberCustomStore(name) {
  const trimmed = String(name || "").trim();
  if (!trimmed || isDefaultStoreName(trimmed)) return readCustomStores();
  const prefs = readPrefs();
  const key = trimmed.toLowerCase();
  const already = (prefs.custom_stores || []).some((s) => String(s || "").trim().toLowerCase() === key);
  if (already) return prefs.custom_stores;
  prefs.custom_stores = [...(prefs.custom_stores || []), trimmed];
  return writePrefs(prefs).custom_stores;
}

function rememberStoresFromItems(items) {
  for (const it of items || []) {
    if (it && it.store) rememberCustomStore(it.store);
  }
}

function knownStores() {
  const seen = new Set(DEFAULT_STORES.map((s) => s.value.toLowerCase()));
  const extras = [];
  for (const name of readCustomStores()) {
    const key = name.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    extras.push({ value: name, label: name });
  }
  return [...DEFAULT_STORES, ...extras];
}

function normalizeStoreName(name) {
  const trimmed = String(name || "").trim();
  if (!trimmed) return "";
  if (/^amazon$/i.test(trimmed)) return "Amazon";
  if (/^(ml|mercado\s*libre)$/i.test(trimmed)) return "ML";
  const hit = knownStores().find((s) => s.value.toLowerCase() === trimmed.toLowerCase());
  return hit ? hit.value : trimmed;
}

function pendingKeyOf(item) {
  return [item.sku || "", item.done_id || item.action_key || "", item.created_at || ""].join("|");
}

function mergePendingItems(primary, extras) {
  const out = [];
  const seen = new Set();
  for (const item of [...(primary || []), ...(extras || [])]) {
    if (!item || !item.sku) continue;
    const k = pendingKeyOf(item);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(item);
  }
  return out;
}

function hydratePendingFromServer(data, fileItems) {
  const local = readPending();
  const fromRoot = Array.isArray(data && data.purchases_pending)
    ? data.purchases_pending
    : (data && data.purchases_pending && Array.isArray(data.purchases_pending.items) ? data.purchases_pending.items : []);
  const merged = mergePendingItems(local.items, mergePendingItems(fromRoot, fileItems || []));
  rememberStoresFromItems(merged);
  if (local.items.length) {
    if (merged.length !== local.items.length) writePending({ ...local, items: merged });
    return readPending();
  }
  if (merged.length) return writePending({ ...local, items: merged });
  return local;
}

function upsertPurchase(item) {
  const doc = readPending();
  const idx = doc.items.findIndex((x) =>
    x.status !== "cancelled" &&
    x.sku === item.sku &&
    String(x.done_id || x.action_key || "") === String(item.done_id || item.action_key || "")
  );
  if (idx >= 0) doc.items[idx] = { ...doc.items[idx], ...item };
  else doc.items.unshift(item);
  return writePending(doc);
}

function purchaseStatusOf(item) {
  const s = String((item && item.status) || "pending").trim().toLowerCase();
  return s || "pending";
}

function isWaitingPurchase(item) {
  if (!item) return false;
  const s = purchaseStatusOf(item);
  return s === "pending" || s === "undefined";
}

function isImportedPurchase(item) {
  return !!item && purchaseStatusOf(item) === "imported";
}

function isCancelledPurchase(item) {
  return !!item && purchaseStatusOf(item) === "cancelled";
}

function matchPurchase(item, card) {
  if (!item || !card || isCancelledPurchase(item)) return false;
  if (item.sku !== card.sku) return false;
  return String(item.done_id || item.action_key || "") === cardId(card);
}

function purchaseForCard(card) {
  return readPending().items.find((x) => matchPurchase(x, card) && isWaitingPurchase(x)) || null;
}

function importedPurchaseForCard(card) {
  return readPending().items.find((x) => matchPurchase(x, card) && isImportedPurchase(x)) || null;
}

function waitingPurchaseForCard(card) {
  return purchaseForCard(card);
}

function livePurchaseForCard(card) {
  return purchaseForCard(card) || importedPurchaseForCard(card);
}

function dismissLocalPurchase(card) {
  if (!card) return;
  const id = cardId(card);
  const sku = card.sku;
  const doc = readPending();
  doc.items = (doc.items || []).map((x) => {
    if (!x) return x;
    const same = x.sku === sku && String(x.done_id || x.action_key || "") === id;
    if (!same) return x;
    return { ...x, status: "cancelled", dismissed_at: new Date().toISOString() };
  });
  writePending(doc);
  try { localStorage.removeItem(storeKey(id)); } catch { /* ignore */ }
}

function purchaseBits(purchase) {
  if (!purchase) return "";
  const qty = Number(purchase.qty) || 1;
  const piezas = qty === 1 ? "1 pieza" : qty + " piezas";
  const paid = purchaseTotal(purchase);
  const store = purchase.store ? ` · ${purchase.store}` : "";
  const paidTxt = paid ? ` · ${money0(paid)}` : "";
  return `${piezas}${paidTxt}${store}`;
}

function readInbox() {
  try {
    const raw = JSON.parse(localStorage.getItem(INBOX_KEY) || "null");
    if (raw && Array.isArray(raw.actions)) return raw;
  } catch { /* ignore */ }
  return { file: "pages_action_inbox.json", actions: [] };
}

function appendInboxAction({ sku, done_id, outcome }) {
  const doc = readInbox();
  doc.actions.unshift({
    action_key: done_id,
    created_at: new Date().toISOString(),
    done_id,
    outcome,
    sku,
    source: "pages"
  });
  localStorage.setItem(INBOX_KEY, JSON.stringify(doc));
}

function hideIsStaleForResurgido(st, card) {
  const sku = asText((card && card.sku) || (st && st.sku));
  const row = resurgidoRowForSku(sku, cachedData);
  const flagged = !!(card && isResurgido(card))
    || !!(st && (truthyFlag(st.resurgido) || normTag(st.status) === "resurgido"))
    || !!row;
  if (!flagged) return false;
  const resurrectedAt = Date.parse(
    (card && card.resurrected_at) || (st && st.resurrected_at) || (row && row.resurrected_at) || 0
  );
  if (!st || !st.hide_until) return true;
  const hideUntil = Date.parse(st.hide_until);
  if (Number.isNaN(hideUntil)) return true;
  if (Number.isNaN(resurrectedAt) || !resurrectedAt) return true;
  const hideDays = Number(st.hide_days) || 0;
  const hideStart = hideUntil - hideDays * 86400000;
  return resurrectedAt > hideStart;
}

function isHidden(st, card) {
  if (hideIsStaleForResurgido(st, card)) return false;
  if (!st || !st.hide_until) return false;
  if (st.outcome === "purchased") return false;
  const t = Date.parse(st.hide_until);
  return !Number.isNaN(t) && t > Date.now();
}

function hideDaysFor(outcome, card) {
  const maps = [];
  if (card && card.hide_days_default && typeof card.hide_days_default === "object") maps.push(card.hide_days_default);
  if (cachedData && cachedData.hide_days_default && typeof cachedData.hide_days_default === "object") maps.push(cachedData.hide_days_default);
  if (cachedData && cachedData.done_contract && cachedData.done_contract.hide_days) maps.push(cachedData.done_contract.hide_days);
  maps.push(HIDE_DAYS);
  for (const m of maps) {
    if (m && m[outcome] != null && !Number.isNaN(Number(m[outcome]))) return Number(m[outcome]);
  }
  return 1;
}

function hideUntilIso(days) {
  const d = new Date();
  d.setDate(d.getDate() + (Number(days) || 0));
  return d.toISOString();
}

function formatHideUntil(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return String(iso);
  try {
    return new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", year: "numeric" }).format(new Date(t));
  } catch {
    return String(iso);
  }
}

function weekStartMs(d = new Date()) {
  const x = new Date(d);
  const day = x.getDay();
  const diff = (day + 6) % 7;
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - diff);
  return x.getTime();
}

function purchaseTotal(item) {
  if (item.total != null && !Number.isNaN(Number(item.total))) return Number(item.total);
  const qty = Number(item.qty) || 1;
  const unit = Number(item.unit_price);
  if (!Number.isNaN(unit)) return unit * qty;
  return 0;
}

function weeklyPendingSpend(items) {
  const start = weekStartMs();
  return (items || []).filter((it) => it.status !== "cancelled" && it.status !== "imported")
    .filter((it) => !it.created_at || Date.parse(it.created_at) >= start)
    .reduce((sum, it) => sum + purchaseTotal(it), 0);
}

function decisionLabel(id) {
  return (DECISIONS.find((d) => d.id === id) || {}).label || id;
}

function hallazgoDecision(raw) {
  const key = String(raw || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
  if (key === "PRECIOBUENO" || key === "PRECIO_BUENO") return "PRECIO_BUENO";
  if (DECISION_IDS.includes(key)) return key;
  return "MANUAL";
}

function parseImportedEstado(raw) {
  const key = String(raw || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
  if (!key || key === OFFER_FOUND || key === RESURGIDO) return null;
  if (key === "PRECIOBUENO" || key === "PRECIO_BUENO") return "PRECIO_BUENO";
  if (DECISION_IDS.includes(key)) return key;
  return null;
}

function parseCsvFlag(raw) {
  const s = String(raw || "").trim();
  if (!s) return null;
  const key = s.toLowerCase().replace(/[\s-]+/g, "_");
  if (key === "true" || key === "1" || key === "si" || key === "sí" || key === "yes") return true;
  if (offerStatus(s) === OFFER_FOUND) return true;
  if (key === "false" || key === "0") return false;
  return null;
}

function emptyEstadoDoc() {
  return { schema: "arfershop.radar.hallazgo_estado.v1", updated_at: null, by_sku: {} };
}

function readEstadoOverlays() {
  try {
    const raw = JSON.parse(localStorage.getItem(ESTADO_KEY) || "null");
    if (raw && raw.by_sku && typeof raw.by_sku === "object") return raw.by_sku;
    if (raw && typeof raw === "object" && !Array.isArray(raw) && !raw.schema) return raw;
  } catch { /* ignore */ }
  return {};
}

function writeEstadoOverlays(bySku) {
  localStorage.setItem(ESTADO_KEY, JSON.stringify({
    schema: "arfershop.radar.hallazgo_estado.v1",
    updated_at: new Date().toISOString(),
    by_sku: bySku || {}
  }));
}

function writeImportResult(doc) {
  const next = {
    schema: "arfershop.radar.csv_import_result.v1",
    imported_at: new Date().toISOString(),
    hook: "refreshResurgidos",
    source_tab: activeTab,
    ...(doc && typeof doc === "object" ? doc : {})
  };
  localStorage.setItem(IMPORT_RESULT_KEY, JSON.stringify(next));
  return next;
}

function applyEstadoOverlayToItem(item, ov) {
  if (!item || !ov) return item;
  if (ov.estado && DECISION_IDS.includes(ov.estado)) item.decision = ov.estado;
  if (ov.upc) item.upc = ov.upc;
  if (ov.qty != null) item.qty = ov.qty;
  if (ov.techo != null) item.techo_mxn = ov.techo;
  if (ov.landed != null) item.found_landed = ov.landed;
  if (ov.margen != null) item.roi_pct = ov.margen;
  if (ov.gate_ok === true || ov.gate_ok === false) item.gate_ok = ov.gate_ok;
  if (ov.why) item.por_que = ov.why;
  if (ov.url_amazon) item.url_amazon = ov.url_amazon;
  if (ov.url_ml) item.url_ml = ov.url_ml;
  if (ov.url_oferta) item.url_oferta = ov.url_oferta;
  if (ov.notas) item.notas = ov.notas;
  return item;
}

function applyEstadoOverlaysToDoc(doc) {
  if (!doc || !Array.isArray(doc.items)) return doc;
  const bySku = readEstadoOverlays();
  for (const it of doc.items) applyEstadoOverlayToItem(it, bySku[asText(it.sku)]);
  doc.counts = countHallazgoItems(doc.items);
  return doc;
}

function numOrNull(v) {
  if (v == null || v === "") return null;
  const n = Number(v);
  return Number.isNaN(n) ? null : n;
}

function normalizeHallazgoItem(raw) {
  if (!raw || typeof raw !== "object") return null;
  const sku = asText(raw.sku);
  if (!sku) return null;
  return {
    sku,
    upc: asText(raw.upc),
    name: asText(raw.name) || sku,
    decision: hallazgoDecision(raw.decision),
    qty: numOrNull(raw.qty),
    techo_mxn: numOrNull(raw.techo_mxn),
    por_que: asText(raw.por_que),
    soh: numOrNull(raw.soh),
    sales_30: numOrNull(raw.sales_30),
    sales_90: numOrNull(raw.sales_90),
    sales_total: numOrNull(raw.sales_total),
    ganancia_estimada_mxn: numOrNull(raw.ganancia_estimada_mxn),
    roi_pct: numOrNull(raw.roi_pct),
    gate_ok: raw.gate_ok === true ? true : raw.gate_ok === false ? false : null,
    gate_reason_es: asText(raw.gate_reason_es),
    action_motor: asText(raw.action_motor),
    suggested_order: numOrNull(raw.suggested_order),
    found_landed: numOrNull(firstDefined(raw.found_landed, raw.found_landed_cost_mxn, raw.ganancia)),
    url_amazon: asText(firstDefined(raw.url_amazon, raw.shopping_url)),
    url_ml: asText(firstDefined(raw.url_ml, raw.marketplace_url)),
    url_oferta: asText(firstDefined(raw.url_oferta, raw.found_url, raw.offer_url)),
    notas: asText(firstDefined(raw.notas, raw.notes))
  };
}

function emptyHallazgoCounts() {
  return { RECOMPRAR: 0, PRECIO_BUENO: 0, ESPERAR: 0, NO: 0, MANUAL: 0, total: 0 };
}

function countHallazgoItems(items) {
  const counts = emptyHallazgoCounts();
  for (const it of items) {
    counts[it.decision] = (counts[it.decision] || 0) + 1;
    counts.total += 1;
  }
  return counts;
}

function normalizeHallazgoDoc(raw) {
  const items = Array.isArray(raw && raw.items)
    ? raw.items.map(normalizeHallazgoItem).filter(Boolean)
    : [];
  const computed = countHallazgoItems(items);
  const given = raw && raw.counts && typeof raw.counts === "object" ? raw.counts : {};
  const counts = emptyHallazgoCounts();
  for (const id of DECISION_IDS) {
    const n = numOrNull(given[id]);
    counts[id] = n != null ? n : computed[id];
  }
  counts.total = numOrNull(given.total) != null ? Number(given.total) : computed.total;
  const gate = raw && raw.gate && typeof raw.gate === "object" ? raw.gate : {};
  return {
    schema: asText(raw && raw.schema) || HALLAZGO_SCHEMA,
    generated_at: asText(raw && raw.generated_at),
    source_snapshot_at: asText(raw && raw.source_snapshot_at),
    gate: {
      ganancia_min_mxn: numOrNull(gate.ganancia_min_mxn) ?? 120,
      roi_min_pct: numOrNull(gate.roi_min_pct) ?? 30
    },
    counts,
    items
  };
}

function hallazgoTabCount() {
  if (hallazgoStatus === "ok" && hallazgoDoc) return hallazgoDoc.counts.total;
  return null;
}

function hallazgoVerbTitle(item) {
  const name = item.name || item.sku || "este producto";
  if (item.decision === "RECOMPRAR") return `Recompra ${name}`;
  if (item.decision === "PRECIO_BUENO") return `Caza precio bueno de ${name}`;
  if (item.decision === "ESPERAR") return `Espera ${name}`;
  if (item.decision === "NO") return `No recompras ${name}`;
  return `Revisa a mano ${name}`;
}

function hallazgoTechoHtml(item) {
  const cap = item.techo_mxn;
  if (cap == null || cap <= 0) {
    return `<p class="techo-block hallazgo-techo"><span class="techo-verb">Compra solo si no pasa de</span><span class="techo-amount techo-empty">—</span></p>`;
  }
  return `<p class="techo-block hallazgo-techo"><span class="techo-verb">Compra solo si no pasa de</span><span class="techo-amount">${esc(money0(cap))}</span></p>`;
}

function hallazgoGateChip(item) {
  if (item.decision !== "RECOMPRAR" || item.gate_ok !== false) return "";
  const reason = item.gate_reason_es || "No pasa el piso de ganancia/ROI";
  return `<span class="gate-chip">${esc(reason)}</span>`;
}

function hallazgoSignal(item) {
  const bits = [];
  if (item.soh != null) bits.push(`existencias ${item.soh}`);
  if (item.sales_30 != null) bits.push(`${item.sales_30} en 30d`);
  if (item.sales_90 != null) bits.push(`${item.sales_90} en 90d`);
  if (item.sales_total != null) bits.push(`${item.sales_total} hist`);
  return bits.join(" · ");
}

function hallazgoMoney(item) {
  const bits = [];
  if (item.ganancia_estimada_mxn != null) bits.push(`ganas ~${money0(item.ganancia_estimada_mxn)}`);
  if (item.roi_pct != null) bits.push(`ROI ~${Number(item.roi_pct).toFixed(0)}%`);
  return bits.join(" · ");
}

function hallazgoMotor(item) {
  const bits = [];
  if (item.action_motor) bits.push(item.action_motor);
  const order = item.suggested_order;
  if (order != null && order > 0) bits.push(order === 1 ? "pide 1" : `pide ${order}`);
  const qty = item.qty;
  if (qty != null && qty > 0) bits.push(qty === 1 ? "1 pieza" : `${qty} piezas`);
  return bits.join(" · ");
}

function hallazgoMatchesQuery(item, q) {
  if (!q) return true;
  const blob = [item.sku, item.upc, item.name, item.por_que, item.action_motor].join(" ").toLowerCase();
  return blob.includes(q);
}

function filteredHallazgoItems() {
  const items = (hallazgoDoc && hallazgoDoc.items) || [];
  const q = hallazgoQuery.trim().toLowerCase();
  return items.filter((it) => {
    if (hallazgoFilter !== "ALL" && it.decision !== hallazgoFilter) return false;
    return hallazgoMatchesQuery(it, q);
  });
}

function hallazgoCsvItems() {
  const items = (hallazgoDoc && hallazgoDoc.items) || [];
  if (hallazgoFilter === "ALL" || hallazgoCsvScope === "all") return items.slice();
  return items.filter((it) => it.decision === hallazgoFilter);
}

function sortHallazgoItems(items) {
  return items.slice().sort((a, b) => {
    const ga = a.ganancia_estimada_mxn;
    const gb = b.ganancia_estimada_mxn;
    if (ga != null && gb != null && gb !== ga) return gb - ga;
    if (gb != null && ga == null) return 1;
    if (ga != null && gb == null) return -1;
    return String(a.sku).localeCompare(String(b.sku), "es-MX");
  });
}

function groupedHallazgoItems(items) {
  const groups = { RECOMPRAR: [], PRECIO_BUENO: [], ESPERAR: [], NO: [], MANUAL: [] };
  for (const it of items) groups[it.decision].push(it);
  for (const id of DECISION_IDS) groups[id] = sortHallazgoItems(groups[id]);
  return groups;
}

function formatStamp(raw) {
  const t = Date.parse(raw);
  if (Number.isNaN(t)) return asText(raw);
  try {
    return new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(t));
  } catch {
    return asText(raw);
  }
}

function hallazgoMetaLine() {
  if (!hallazgoDoc) return "";
  const g = hallazgoDoc.gate || {};
  const bits = [];
  if (g.ganancia_min_mxn != null && g.roi_min_pct != null) {
    bits.push(`Piso Recomprar: gana ≥ ${money0(g.ganancia_min_mxn)} y ROI ≥ ${Number(g.roi_min_pct).toFixed(0)}%`);
  }
  if (hallazgoDoc.source_snapshot_at) bits.push("snapshot " + formatStamp(hallazgoDoc.source_snapshot_at));
  if (hallazgoDoc.generated_at) bits.push("emitido " + formatStamp(hallazgoDoc.generated_at));
  return bits.join(" · ");
}

      ${chips.map((c) =>

}

function renderHallazgoBody() {
  if (hallazgoStatus === "loading" || hallazgoStatus === "idle") {
    return `<div class="state"><h2>Armando el catálogo de Hallazgo</h2><p>Estoy leyendo hallazgos_inventario.json.</p></div>
      <div class="stack">${skelCardHtml()}${skelCardHtml()}</div>`;
  }
  if (hallazgoStatus === "missing") {
    return `<div class="state">
      <h2>Aún no llega el inventario</h2>
      <p>Codex todavía está emitiendo hallazgos_inventario.json. Hoy, Más oportunidades y Ya decididas siguen igual.</p>
      <div class="actions"><button type="button" class="btn-primary" id="retryHallazgo">Reintentar</button></div>
    </div>`;
  }
  if (hallazgoStatus === "error") {
    return `<div class="state">
      <h2>No pude leer Hallazgo</h2>
      <p>${esc(hallazgoError || "Algo falló al leer el catálogo.")} Hoy sigue intacto.</p>
      <div class="actions"><button type="button" class="btn-primary" id="retryHallazgo">Reintentar</button></div>
    </div>`;
  }
  const items = filteredHallazgoItems();
  const counts = hallazgoDoc ? hallazgoDoc.counts : emptyHallazgoCounts();
  const filters = renderHallazgoFilters(counts);
  const meta = hallazgoMetaLine();
  if (!items.length) {
    const why = hallazgoQuery.trim()
      ? "Ningún SKU coincide con esa búsqueda."
      : (hallazgoFilter === "ALL" ? "Hallazgo llegó sin SKUs." : `Ningún SKU en ${decisionLabel(hallazgoFilter)}.`);
    return `${filters}${meta ? `<p class="hallazgo-meta">${esc(meta)}</p>` : ""}
      <div class="state"><h2>${esc(why)}</h2><p>Cambia el filtro o limpia la búsqueda.</p></div>`;
  }
  const groups = groupedHallazgoItems(items);
  const order = hallazgoFilter === "ALL" ? DECISION_IDS : [hallazgoFilter];
  return `${filters}${meta ? `<p class="hallazgo-meta">${esc(meta)}</p>` : ""}
    ${order.map((id) => renderHallazgoGroup(id, groups[id] || [])).join("")}`;
}

function pageHeadline(tab, n) {
  if (tab === TAB_HALLAZGO) {
    if (hallazgoStatus === "missing") return "Aún no llega Hallazgo";
    if (hallazgoStatus === "error") return "No pude leer Hallazgo";
    if (hallazgoStatus === "loading" || hallazgoStatus === "idle") return "Armando Hallazgo";
    if (!n) return "Hallazgo no tiene SKUs";
    return n === 1 ? "Revisa 1 hallazgo" : `Revisa ${n} hallazgos`;
  }
  if (tab === TAB_QUEUE) {
    if (!n) return "Sin más oportunidades";
    return n === 1 ? "1 oportunidad más" : `${n} oportunidades más`;
  }
  if (tab === TAB_DECIDED) {
    if (!n) return "Nada decidido aún";
    return n === 1 ? "1 ya decidida" : `${n} ya decididas`;
  }
  if (!n) return "Hoy no tienes que comprar nada";
  return n === 1 ? "Hoy: 1 cosa ejecutable" : `Hoy: ${n} cosas ejecutables`;
}

function pageLead(tab, cards, data) {
  if (tab === TAB_HALLAZGO) {
    if (hallazgoStatus === "missing") return "Codex todavía está emitiendo el JSON. El resto del radar no se toca.";
    if (hallazgoStatus === "error") return "El catálogo nativo espera hallazgos_inventario.json. Reintenta cuando esté.";
    if (hallazgoStatus === "loading" || hallazgoStatus === "idle") return "Traigo el catálogo de decisiones sin tocar Hoy.";
    return "Filtra por Recomprar, Precio bueno, Esperar, No o Manual. Exporta o copia el CSV para ChatGPT. El radar no compra solo.";
  }
  if (tab === TAB_QUEUE) {
    if (!cards.length) return "Cuando haya cola, aparece aquí.";
    return "Otras oportunidades si te sobra tiempo.";
  }
  if (tab === TAB_DECIDED) {
    if (!cards.length) return "Aquí verás lo pausado o descartado.";
    return "Pausadas, descartadas o ya resueltas.";
  }
  if (!cards.length) return "Respira. Nada ejecutable hoy.";
  const buscar = cards.filter((c) => cardAction(c) === "BUSCAR").length;
  const comprar = cards.length - buscar;
  const resurgidos = cards.filter(isResurgido).length;
  const bits = [];
  if (comprar > 0) bits.push(comprar === 1 ? "1 para comprar" : `${comprar} para comprar`);
  if (buscar > 0) bits.push(buscar === 1 ? "1 para buscar quién te lo venda" : `${buscar} para buscar proveedor`);
  if (resurgidos > 0) bits.push(resurgidos === 1 ? "1 resurgido" : `${resurgidos} resurgidos`);
  return bits.join(". ") + ".";
}

function ceilingLine(items) {
  const spend = weeklyPendingSpend(items);
  if (spend > 0) {
    return `Llevas ${money0(spend)} de ${money0(WEEKLY_CEILING)} esta semana · tope prudente.`;
  }
  return `Tope semanal prudente: ${money0(WEEKLY_CEILING)}.`;
}

function statusMessage(st) {
  if (!st) return "";
  const base = OUTCOME_TEXT[st.outcome] || localizeToken(st.outcome) || "Guardado";
  if (st.outcome === "purchased") return REGISTERED_SHORT;
  const days = st.hide_days;
  return days ? `${base} · no vuelve por ${days} días` : base;
}

function decidedMetaLine(card) {
  const parts = [];
  const reason = gateReason(card);
  if (card.reason && String(card.reason).trim()) parts.push(localizeToken(card.reason));
  if (card.park_note && String(card.park_note).trim()) parts.push(String(card.park_note).trim());
  if (card.outcome && String(card.outcome).trim()) {
    const o = String(card.outcome).trim();
    parts.push(OUTCOME_TEXT[o] || localizeToken(o));
  }
  if (card.hide_until && String(card.hide_until).trim()) {
    parts.push("oculto hasta " + formatHideUntil(card.hide_until));
  }
  if (reason && !parts.includes(reason)) parts.push(reason);
  return parts.join(" · ");
}

function cardKey(card) {
  return cardId(card) || asText(card && card.sku);
}

function promoteResurgidosFromDecided(hoySeed, queueBase, decidedAll) {
  const seen = new Set();
  const promoted = [];
  const decided = [];
  for (const c of decidedAll || []) {
    const key = cardKey(c);
    if (isResurgido(c)) {
      if (key && !seen.has(key)) {
        promoted.push(c);
        seen.add(key);
      }
      continue;
    }
    decided.push(c);
  }
  const hoy = [];
  const overflow = [];
  const take = (c) => {
    const key = cardKey(c);
    if (key && hoy.some((x) => cardKey(x) === key)) return;
    if (hoy.length < HOY_MAX) hoy.push(c);
    else overflow.push(c);
  };
  promoted.forEach(take);
  filterVisible(hoySeed || []).forEach(take);
  const hoyKeys = new Set(hoy.map((c) => cardKey(c)).filter(Boolean));
  const queue = [
    ...overflow,
    ...(queueBase || []).filter((c) => {
      const key = cardKey(c);
      return !key || !hoyKeys.has(key);
    })
  ];
  return { cards: hoy, queue, decided, promoted, overflow };
}

function tabLists(data) {
  const hoySeed = (data.cards || []).filter(isHoyExecutable).slice(0, HOY_MAX);
  const queueBase = (Array.isArray(data.queue) ? data.queue : []).filter(isHoyExecutable);
  const decidedAll = decidedSource(data);
  const promoted = promoteResurgidosFromDecided(hoySeed, queueBase, decidedAll);
  return { cards: promoted.cards, queue: promoted.queue, decided: promoted.decided, hoySeed };
}

function filterVisible(cards) {
  return (cards || []).filter((c) => !isHidden(readState(cardId(c)), c));
}

function countsFor(data) {
  const lists = tabLists(data);
  return {
    hoy: filterVisible(lists.cards).length,
    queue: lists.queue.length,
    decided: lists.decided.length
  };
}

function cardsForActiveTab(data) {
  const lists = tabLists(data);
  if (activeTab === TAB_QUEUE) return lists.queue;
  if (activeTab === TAB_DECIDED) {
    return [...lists.decided].sort((a, b) => Number(isResurgido(b)) - Number(isResurgido(a)));
  }
  return filterVisible(lists.cards);
}

function rememberRootOffers(data) {
  offerBySku = new Map();
  for (const o of rootActiveOffers(data)) {
    const sku = o && asText(o.sku);
    if (sku && !offerBySku.has(sku)) offerBySku.set(sku, o);
  }
}

function rememberCards(data) {
  cardById = new Map();
  rememberRootOffers(data);
  const lists = tabLists(data);
  for (const c of [...lists.cards, ...lists.queue, ...lists.decided, ...(data.cards || []), ...(data.parked || [])]) {
    const id = cardId(c);
    if (id && !cardById.has(id)) cardById.set(id, c);
  }
}

}

async function mirrorLocal(payload) {
  try {
    await fetch(LOCAL_API, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (_) { /* silencioso — Pages no depende de :8766 */ }
}

async function macHealth() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 1600);
    const res = await fetch(HEALTH_URL, { method: "GET", mode: "cors", credentials: "omit", cache: "no-store", signal: ctrl.signal });
    clearTimeout(t);
    if (res.status !== 200) return { ok: false };
    const data = await res.json().catch(() => ({}));
    return { ok: data.ok === true, data };
  } catch (_) {
    return { ok: false };
  }
}

function responseImported(res, data) {
  if (!res || (res.status !== 200 && res.status !== 201)) return false;
  const items = [];
  if (data && Array.isArray(data.items)) items.push(...data.items);
  if (data && data.item) items.push(data.item);
  if (items.some((x) => isImportedPurchase(x))) return true;
  if (data && Number(data.imported) > 0) return true;
  if (items.length && items.every((x) => isWaitingPurchase(x))) return false;
  return !!(data && data.ok === true);
}

function purchasePayload(item) {
  return {
    sku: item.sku,
    qty: item.qty,
    unit_price: item.unit_price,
    total: item.total,
    store: item.store,
    url: item.url,
    suggested_qty: item.suggested_qty,
    max_landed: item.max_landed,
    created_at: item.created_at,
    status: item.status || "pending",
    done_id: item.done_id,
    action_key: item.action_key || item.done_id,
    source: item.source || "pages"
  };
}

async function postPurchasePending(item) {
  const payload = purchasePayload(item);
  const res = await fetch(PENDING_POST_URL, {
    method: "POST",
    mode: "cors",
    credentials: "omit",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ item: payload })
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, imported: responseImported(res, data), data };
}

async function syncPurchaseToMac(item) {
  const health = await macHealth();
  if (!health.ok) return { ok: false, reason: "mac_off" };
  try {
    const posted = await postPurchasePending(item);
    if (posted.imported) return { ok: true, imported: true, data: posted.data };
    return { ok: false, reason: posted.ok ? "still_pending" : "post_fail", data: posted.data };
  } catch (_) {
    return { ok: false, reason: "network" };
  }
}

function markSynced(item, imported) {
  const next = { ...item, status: imported ? "imported" : (item.status || "pending") };
  if (imported) {
    next.synced_at = new Date().toISOString();
    delete next.mac_offline;
  } else {
    next.mac_offline = true;
  }
  upsertPurchase(next);
  return next;
}

function csvCell(v) {
  const s = v == null ? "" : String(v);
  if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, "\"\"")}"`;
  return s;
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function makeExportId(d = new Date()) {
  return `EXP-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
}

function csvValue(card, key, ctx) {
  if (key === "export_id") return ctx && ctx.export_id;
  if (key === "exported_at") return ctx && ctx.exported_at;
  if (key === "upc") return cardUpc(card);
  if (key === "name" || key === "title") return productName(card);
  if (key === "tipo" || key === "action") return cardAction(card) || asText(card[key]);
  if (key === "done_id") return cardId(card);
  if (key === "gate_ok") {
    if (card.gate_ok === true) return "true";
    if (card.gate_ok === false) return "false";
    return "";
  }
  if (key === "shopping_url") return card.shopping_url || shoppingHref(card, productName(card));
  if (key === "soh") return card.soh != null ? card.soh : (card.evidence && card.evidence.soh);
  if (key === "sales_30") return card.sales_30 != null ? card.sales_30 : (card.evidence && card.evidence.sales_30);
  if (key === "sales_90") return card.sales_90 != null ? card.sales_90 : (card.evidence && card.evidence.sales_90);
  return card[key];
}

function queueCsv(data) {
  const now = new Date();
  const ctx = { export_id: makeExportId(now), exported_at: now.toISOString() };
  const rows = (data && Array.isArray(data.queue) ? data.queue : []).map((c) => CSV_COLS.map((col) => csvValue(c, col.key, ctx)));
  const header = CSV_COLS.map((col) => col.header).join(",");
  return "\uFEFF" + [header, ...rows.map((r) => r.map(csvCell).join(","))].join("\n");
}

function cardsCsv(cards, cols) {

  const ctx = { export_id: makeExportId(now), exported_at: now.toISOString() };
  const use = cols || CSV_COLS;
  const rows = (cards || []).map((c) => use.map((col) => csvValue(c, col.key, ctx)));
  const header = use.map((col) => col.header).join(",");
  return "\uFEFF" + [header, ...rows.map((r) => r.map(csvCell).join(","))].join("\n");
}
