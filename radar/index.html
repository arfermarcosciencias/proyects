<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f3f7fb"/>
<title>Radar · Hoy</title>
<style>
  :root {
    --bg:#f3f7fb; --card:#fff; --text:#12212f; --muted:#65748a; --muted-2:#8a95a5;
    --line:#e3ebf5; --green:#1f6349; --green-bg:#eaf7f1; --blue:#1d4f91; --blue-bg:#e8f1fb;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding:18px 14px 48px}
  .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
  h1{margin:0 0 8px;font-size:24px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
  .lead{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(18,33,47,.06)}
  .card.done,.card.skipped{opacity:.48}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;margin-bottom:10px}
  .badge.BUSCAR{color:#5b4a8a;background:#f1ecfb}
  .badge.REPONER{color:#1d4f91;background:#e8f1fb}
  .badge.ESTRELLA{color:#8a6a00;background:#fff6d6}
  .badge.CASHFLOW{color:#1f6349;background:var(--green-bg)}
  .row{display:flex;gap:12px;align-items:flex-start}
  .photo{width:92px;height:92px;object-fit:cover;border-radius:12px;background:#eef3f9;flex:0 0 auto}
  .photo.ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted-2);text-align:center;padding:6px}
  .copy{min-width:0;flex:1}
  .index{margin:0;font-size:11px;color:var(--muted-2);font-weight:700}
  .title{margin:2px 0 6px;font-size:17px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
  .supplier{margin:0 0 6px;font-size:12px;color:var(--muted-2)}
  .plata{margin:0 0 6px;font-size:14px;font-weight:650;color:var(--green)}
  .why{margin:0 0 8px;font-size:13px;line-height:1.4;color:var(--muted)}
  .why strong{color:var(--text);font-weight:650}
  .evidence{margin:0 0 8px;font-size:12px;color:var(--muted-2)}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
  .links a{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;
  }
  .links a.primary{background:var(--blue-bg);color:var(--blue)}
  .links a.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .actions{margin-top:12px;display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
  button{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:10px;padding:12px 10px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .btn-primary{background:var(--green-bg);color:var(--green)}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .outcomes{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .outcomes.open{display:grid;gap:8px;grid-template-columns:1fr 1fr}
  .outcomes button{font-size:13px;padding:11px 8px;background:#f7fafc;border:1px solid var(--line);color:var(--text)}
  .status{margin-top:10px;font-size:13px;color:var(--green);font-weight:650;display:none}
  .status.show{display:block}
  .state{margin-top:18px;background:#fff;border-radius:16px;padding:28px 18px;border:1px solid var(--line);text-align:center}
  .state h2{margin:0 0 8px;font-size:18px}
  .state p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .state .actions{max-width:200px;margin:16px auto 0;grid-template-columns:1fr}
  .skel{height:140px;border-radius:16px;background:linear-gradient(90deg,#e8eef6,#f7fafc,#e8eef6);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  footer{margin-top:22px;font-size:11px;color:var(--muted-2);text-align:center}
  footer .sync{margin-top:10px}
  footer button{padding:10px 12px;font-size:12px;width:100%;max-width:280px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const JSON_URL = "./hoy_3_tarjetas.json";
const HIDE_DAYS = { purchased: 7, not_found: 3, tomorrow: 1, descartado: 30, skip: 1 };
const OUTCOME_TEXT = {
  purchased: "Anotado como comprado",
  not_found: "Anotado: no lo encontraste",
  tomorrow: "Lo dejamos para mañana",
  descartado: "Lo retiro por 30 días",
  skip: "Saltado por hoy"
};
const PENDING_KEY = "radar-hoy:pending-inbox:v1";

const money0 = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(Number(n));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey = (id) => `radar-hoy:v1:${id}`;

function productName(card) {
  const t = (card.title || "").trim();
  const generic = !t || /^Busca proveedor/i.test(t) || (/^Compra\s+\d+/i.test(t) && t.length < 28);
  if (!generic) return t;
  const m = (card.por_que || "").match(/·\s*([^:]+?)(?::|$)/);
  if (m) return m[1].replace(/…/g, "").trim();
  return card.sku || "este producto";
}

function verbTitle(card) {
  const name = productName(card);
  const n = Number(card.qty) || 1;
  if (card.action === "BUSCAR" || card.tipo === "BUSCAR") {
    return n === 1 ? `Busca quién te venda ${name}` : `Busca quién te venda ${name} (${n} piezas)`;
  }
  return n === 1 ? `Compra ${name}` : `Compra ${n} de ${name}`;
}

function plataLine(card) {
  const g = card.ganancia_estimada_mxn;
  if (g == null || Number.isNaN(Number(g))) return null;
  return `~gánele ${money0(g)}`;
}

function humanWhy(card) {
  if (card.why_line && String(card.why_line).trim()) return String(card.why_line).trim();
  const ev = card.evidence || {};
  const bits = [];
  if (ev.soh === 0) bits.push("se te acabó");
  if ((ev.sales_30 || 0) > 0 || (ev.sales_90 || 0) > 0) bits.push("se vende seguido");
  if (card.tipo === "ESTRELLA") bits.push("es de tus estrellas");
  if (card.tipo === "CASHFLOW") bits.push("suelta caja rápido");
  if (card.action === "BUSCAR" || card.tipo === "BUSCAR") bits.push("ya no tienes de dónde comprarlo");
  if (bits.length) return [...new Set(bits)].slice(0, 2).join(" y ") + ".";
  let s = (card.por_que || "")
    .replace(/\bsin buy path\b/gi, "")
    .replace(/\bagotado el canal\b/gi, "")
    .replace(/\bbuen historial\b/gi, "")
    .replace(/\bVuelve a buscar proveedor de[^:]+:\s*/i, "")
    .replace(/\s*\/\s*/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (s && s.length < 110) return s.charAt(0).toUpperCase() + s.slice(1);
  return "Vale la pena checarlo hoy.";
}

function evidenceLine(ev) {
  if (!ev) return "";
  const a = [];
  if (ev.sales_30 != null) a.push(`${ev.sales_30} en 30d`);
  if (ev.sales_90 != null) a.push(`${ev.sales_90} en 90d`);
  if (ev.soh != null) a.push(`stock ${ev.soh}`);
  if (ev.days_since_last_sale != null) a.push(`última venta hace ${ev.days_since_last_sale}d`);
  if (ev.unit_margin != null) a.push(`margen ~${money0(ev.unit_margin)}`);
  return a.join(" · ");
}

function fallbackShoppingUrl(name) {
  return "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(name);
}
function fallbackMlUrl(name) {
  return "https://listado.mercadolibre.com.mx/" + encodeURIComponent(name).replace(/%20/g, "-");
}

/** Prefer schema links from emitter; never invent Amazon/Ali product pages. */
function cardLinks(card) {
  const name = productName(card);
  const fromSchema = Array.isArray(card.marketplace_urls) ? card.marketplace_urls.filter(l => l && l.url) : [];
  if (fromSchema.length) {
    return fromSchema.map((l, i) => ({
      label: l.label || (i === 0 ? "Buscar precio" : "Abrir"),
      url: l.url,
      primary: i === 0 || l.kind === "search"
    }));
  }
  const links = [];
  if (card.shopping_url) links.push({ label: "Buscar precio", url: card.shopping_url, primary: true });
  else links.push({ label: "Buscar precio", url: fallbackShoppingUrl(name), primary: true });
  links.push({ label: "Ver en Mercado Libre", url: fallbackMlUrl(name), primary: false });
  return links;
}

function readState(id) {
  try { return JSON.parse(localStorage.getItem(storeKey(id)) || "null"); } catch { return null; }
}
function writeState(id, obj) {
  localStorage.setItem(storeKey(id), JSON.stringify(obj));
}
function readPending() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return []; }
}
function writePending(list) {
  localStorage.setItem(PENDING_KEY, JSON.stringify(list || []));
}
function queueInbox(entry) {
  const list = readPending().filter(x => !(x.action_key === entry.action_key && x.outcome === entry.outcome));
  list.push(entry);
  writePending(list);
}

function pageHeadline(data) {
  const n = (data.cards || []).length;
  if (!n) return "Hoy no tienes que comprar nada";
  return n === 1 ? "Hoy: 1 cosa" : `Hoy: ${n} cosas`;
}
function pageLead(data) {
  const cards = data.cards || [];
  if (!cards.length) return data.lead || "Respira. Nada urgente.";
  const buscar = cards.filter(c => c.action === "BUSCAR" || c.tipo === "BUSCAR").length;
  const comprar = cards.length - buscar;
  const bits = [];
  if (comprar > 0) bits.push(comprar === 1 ? "1 para comprar" : `${comprar} para comprar`);
  if (buscar > 0) bits.push(buscar === 1 ? "1 para buscar quién te lo venda" : `${buscar} para buscar proveedor`);
  return bits.join(". ") + ".";
}

function renderLoading() {
  return `<p class="eyebrow">Radar · Hoy</p><h1>Cargando…</h1><div class="stack"><div class="skel"></div><div class="skel"></div></div>`;
}
function renderError(msg) {
  return `<p class="eyebrow">Radar · Hoy</p><h1>No pude cargar el día</h1>
    <div class="state"><h2>Algo falló</h2><p>${esc(msg)}</p>
    <div class="actions"><button class="btn-primary" id="retry">Reintentar</button></div></div>`;
}
function renderEmpty(data) {
  const meta = data.meta || {};
  let datum = "Nada pendiente.";
  if (meta.paused_by_operator) datum = `Tienes ${meta.paused_by_operator} pausados a propósito.`;
  return `<p class="eyebrow">Radar · Hoy</p><h1>${esc(pageHeadline(data))}</h1>
    <p class="lead">${esc(data.lead || "Hoy no hace falta comprar.")}</p>
    <div class="state"><h2>Hoy no hace falta comprar</h2><p>${esc(datum)}</p></div>`;
}

function statusMessage(st) {
  if (!st) return "";
  if (st.outcome === "skip") return OUTCOME_TEXT.skip;
  const base = OUTCOME_TEXT[st.outcome] || "Guardado";
  const days = HIDE_DAYS[st.outcome];
  return days ? `${base} · no vuelve por ${days} días` : base;
}

function renderLinks(card) {
  return `<div class="links">${cardLinks(card).map((l, i) =>
    `<a class="${i === 0 ? "primary" : "secondary"}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
  ).join("")}</div>`;
}

function renderCard(card, i) {
  const st = readState(card.done_id);
  const cls = !st ? "" : (st.outcome === "skip" || st.outcome === "tomorrow" ? "skipped" : "done");
  const img = card.image_url
    ? `<img class="photo" src="${esc(card.image_url)}" alt=""/>`
    : `<div class="photo ph">Sin foto</div>`;
  const plata = plataLine(card);
  const ev = evidenceLine(card.evidence);
  const locked = !!st;
  const supplier = card.supplier_name ? `<p class="supplier">Última tienda: ${esc(card.supplier_name)}</p>` : "";
  return `<article class="card ${cls}" data-done-id="${esc(card.done_id)}" data-sku="${esc(card.sku)}">
    <span class="badge ${esc(card.tipo)}">${esc(card.tipo)}</span>
    <div class="row">
      ${img}
      <div class="copy">
        <p class="index">#${i + 1}</p>
        <h2 class="title">${esc(verbTitle(card))}</h2>
        ${supplier}
        ${plata ? `<p class="plata">${esc(plata)}</p>` : ""}
        <p class="why"><strong>Por qué:</strong> ${esc(humanWhy(card))}</p>
        ${ev ? `<p class="evidence">${esc(ev)}</p>` : ""}
        ${renderLinks(card)}
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" data-act="done" ${locked ? "disabled" : ""}>Ya lo hice</button>
      <button class="btn-secondary" data-act="skip" ${locked ? "disabled" : ""}>Saltar</button>
    </div>
    <div class="outcomes" data-outcomes>
      <button type="button" data-outcome="purchased">Ya lo compré</button>
      <button type="button" data-outcome="not_found">No lo encontré</button>
      <button type="button" data-outcome="tomorrow">Mañana</button>
      <button type="button" data-outcome="descartado">Descartar 30d</button>
    </div>
    <p class="status ${locked ? "show" : ""}" data-status>${esc(statusMessage(st))}</p>
  </article>`;
}

function renderData(data) {
  const cards = (data.cards || []).slice(0, 3);
  if (!cards.length) return renderEmpty(data);
  const pending = readPending().length;
  return `<p class="eyebrow">Radar · Hoy</p>
    <h1>${esc(pageHeadline(data))}</h1>
    <p class="lead">${esc(pageLead(data))}</p>
    <div class="stack">${cards.map(renderCard).join("")}</div>
    <footer>
      Actualizado ${esc(data.generated_at || "")}
      <div class="sync">
        <button class="btn-secondary" id="export-inbox">Exportar ${pending} para el Mac</button>
      </div>
    </footer>`;
}

function tryDeepLink(entry) {
  // Optional future handler on Mac; no-op if unregistered. FA OK to wire scheme.
  try {
    const u = new URL("arfershop-radar://action");
    u.searchParams.set("action_key", entry.action_key);
    u.searchParams.set("sku", entry.sku || "");
    u.searchParams.set("outcome", entry.outcome);
    const img = new Image();
    img.src = u.toString();
  } catch (_) {}
}

function lockCard(card, outcome) {
  const id = card.getAttribute("data-done-id");
  const sku = card.getAttribute("data-sku") || "";
  const payload = { outcome, at: new Date().toISOString(), days: HIDE_DAYS[outcome] || 0 };
  writeState(id, payload);
  const entry = {
    action_key: id,
    done_id: id,
    sku,
    outcome: outcome === "skip" ? "tomorrow" : outcome,
    created_at: new Date().toISOString(),
    source: "pages"
  };
  queueInbox(entry);
  tryDeepLink(entry);
  card.classList.toggle("done", outcome !== "skip" && outcome !== "tomorrow");
  card.classList.toggle("skipped", outcome === "skip" || outcome === "tomorrow");
  card.querySelectorAll(".actions button").forEach(b => b.disabled = true);
  const panel = card.querySelector("[data-outcomes]");
  if (panel) panel.classList.remove("open");
  const status = card.querySelector("[data-status]");
  if (status) {
    status.textContent = statusMessage(payload);
    status.classList.add("show");
  }
  const btn = document.getElementById("export-inbox");
  if (btn) btn.textContent = `Exportar ${readPending().length} para el Mac`;
}

function exportInbox() {
  const actions = readPending();
  const blob = new Blob([JSON.stringify({ actions }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pages_action_inbox.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function wire(root) {
  root.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (ev) => {
      const doneBtn = ev.target.closest("button[data-act='done']");
      const skipBtn = ev.target.closest("button[data-act='skip']");
      const outBtn = ev.target.closest("button[data-outcome]");
      if (doneBtn && !doneBtn.disabled) {
        const panel = card.querySelector("[data-outcomes]");
        panel?.classList.toggle("open");
        return;
      }
      if (skipBtn && !skipBtn.disabled) {
        lockCard(card, "skip");
        return;
      }
      if (outBtn) {
        lockCard(card, outBtn.getAttribute("data-outcome"));
      }
    });
  });
  root.querySelector("#export-inbox")?.addEventListener("click", exportInbox);
}

async function load() {
  const app = document.getElementById("app");
  app.innerHTML = renderLoading();
  try {
    const res = await fetch(JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("No encontré el archivo del día");
    const data = await res.json();
    app.innerHTML = renderData(data);
    wire(app);
  } catch (e) {
    app.innerHTML = renderError(e.message || "Error");
    document.getElementById("retry")?.addEventListener("click", load);
  }
}
load();
</script>
</body>
</html>
