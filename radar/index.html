<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f3f7fb"/>
<title>Radar · Hoy</title>
<style>
  :root {
    --bg: #f3f7fb;
    --card: #ffffff;
    --text: #12212f;
    --muted: #65748a;
    --muted-2: #8a95a5;
    --line: #e3ebf5;
    --green: #1f6349;
    --green-bg: #eaf7f1;
    --accent: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 18px 14px 40px; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; }
  .lead { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; }
  .stack { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; box-shadow: 0 8px 24px rgba(18,33,47,.06);
  }
  .card.done, .card.skipped { opacity: .45; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
  }
  .badge.BUSCAR { color: #5b4a8a; background: #f1ecfb; }
  .badge.REPONER { color: #1d4f91; background: #e8f1fb; }
  .badge.ESTRELLA { color: #8a6a00; background: #fff6d6; }
  .badge.CASHFLOW { color: #1f6349; background: var(--green-bg); }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .photo {
    width: 92px; height: 92px; object-fit: cover; border-radius: 12px;
    background: #eef3f9; flex: 0 0 auto;
  }
  .photo.ph {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--muted-2); text-align: center; padding: 6px;
  }
  .copy { min-width: 0; flex: 1; }
  .index { margin: 0; font-size: 11px; color: var(--muted-2); font-weight: 700; }
  .title { margin: 2px 0 6px; font-size: 17px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  .action-line { margin: 0 0 4px; font-size: 15px; font-weight: 650; color: var(--text); }
  .ceiling { margin: 0 0 4px; font-size: 14px; font-weight: 650; color: var(--green); }
  .money { margin: 0 0 6px; font-size: 14px; color: var(--green); font-weight: 650; }
  .why { margin: 0 0 6px; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .evidence { margin: 0; font-size: 12px; color: var(--muted-2); }
  .actions { margin-top: 12px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
  button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
    border-radius: 10px; padding: 12px 10px; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--green-bg); color: var(--green); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .state {
    margin-top: 18px; background: #fff; border-radius: 16px; padding: 28px 18px;
    border: 1px solid var(--line); text-align: center;
  }
  .state h2 { margin: 0 0 8px; font-size: 18px; }
  .state p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .state .actions { max-width: 200px; margin: 16px auto 0; grid-template-columns: 1fr; }
  .skel { height: 120px; border-radius: 16px; background: linear-gradient(90deg,#e8eef6,#f7fafc,#e8eef6); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  footer { margin-top: 22px; font-size: 11px; color: var(--muted-2); text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const JSON_URL = "./hoy_3_tarjetas.json";

const money = (n) => {
  if (n == null || Number.isNaN(Number(n))) return null;
  return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(Number(n));
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey = (id) => `radar-hoy:${id}`;

function productName(card) {
  const t = (card.title || "").trim();
  const generic = !t || /^Busca proveedor/i.test(t) || /^Compra\s+\d+/i.test(t) && t.length < 24;
  if (!generic) return t;
  const m = (card.por_que || "").match(/·\s*([^:]+?)(?::|$)/);
  if (m) return m[1].replace(/…/g, "").trim();
  return card.sku || "Producto";
}

function actionSentence(card) {
  const n = Number(card.qty) || 1;
  const piezas = n === 1 ? "1 pieza" : `${n} piezas`;
  if (card.action === "COMPRAR" || card.tipo === "REPONER" || card.tipo === "ESTRELLA" || card.tipo === "CASHFLOW") {
    if (card.action === "BUSCAR") return `Busca ${piezas} con un proveedor nuevo`;
    return `Compra ${piezas} hoy`;
  }
  if (card.action === "BUSCAR") return `Busca ${piezas} con un proveedor`;
  return `Revisa este SKU`;
}

function ceilingSentence(card) {
  const m = money(card.max_landed_cost);
  if (!m || Number(card.max_landed_cost) <= 0) return null;
  return `No pagues más de ${m} por pieza`;
}

function moneySentence(card) {
  const g = money(card.ganancia_estimada_mxn);
  const r = card.roi_pct;
  if (g) {
    if (r != null && !Number.isNaN(Number(r))) {
      return `Ganarías más o menos ${g} (ROI ${Number(r).toFixed(0)}%)`;
    }
    return `Ganarías más o menos ${g}`;
  }
  return "La ganancia sale cuando cotices el precio";
}

function humanWhy(card) {
  let s = (card.por_que || "").trim();
  if (!s) return "";
  // quitar ruido de jerga
  s = s
    .replace(/\bsin buy path\b/gi, "sin canal de compra")
    .replace(/\bagotado el canal\b/gi, "se te acabó de dónde comprarlo")
    .replace(/\bbuen historial\b/gi, "se ha vendido bien")
    .replace(/\bmicroventa\b/gi, "venta chica")
    .replace(/\s*\/\s*/g, ". ");
  // si empieza con plantilla larga, acortar a lo útil tras :
  const parts = s.split(":");
  if (parts.length > 1 && parts[0].length > 40) {
    const rest = parts.slice(1).join(":").trim();
    if (rest) s = rest.charAt(0).toUpperCase() + rest.slice(1);
  }
  return s;
}

function evidenceLine(ev) {
  if (!ev) return "";
  const a = [];
  if (ev.sales_30 != null) a.push(`${ev.sales_30} venta${ev.sales_30 === 1 ? "" : "s"} en 30 días`);
  if (ev.sales_90 != null) a.push(`${ev.sales_90} en 90 días`);
  if (ev.soh != null) a.push(`stock ${ev.soh}`);
  return a.join(" · ");
}

function pageHeadline(data) {
  const n = (data.cards || []).length;
  if (!n) return data.headline || "Hoy no tienes que comprar nada";
  if (data.kind === "tarea_del_dia" || n > 0) {
    if (n === 1) return "Hoy: 1 cosa que hacer";
    return `Hoy: ${n} cosas que hacer`;
  }
  return data.headline || `Hoy: ${n} cosas`;
}

function pageLead(data) {
  const cards = data.cards || [];
  if (!cards.length) return data.lead || "Respira. No hay reposición urgente.";
  const buscar = cards.filter(c => c.action === "BUSCAR" || c.tipo === "BUSCAR").length;
  const comprar = cards.filter(c => c.action === "COMPRAR").length;
  const bits = [];
  if (comprar) bits.push(comprar === 1 ? "1 para comprar" : `${comprar} para comprar`);
  if (buscar) bits.push(buscar === 1 ? "1 para buscar proveedor" : `${buscar} para buscar proveedor`);
  return bits.length ? bits.join(". ") + "." : (data.lead || "");
}

function renderLoading() {
  return `<p class="eyebrow">Radar · Hoy</p><h1>Cargando…</h1>
    <div class="stack"><div class="skel"></div><div class="skel"></div></div>`;
}

function renderError(msg) {
  return `<p class="eyebrow">Radar · Hoy</p><h1>No pude cargar el día</h1>
    <div class="state"><h2>Algo falló</h2><p>${esc(msg)}</p>
    <div class="actions"><button class="btn-primary" id="retry">Reintentar</button></div></div>`;
}

function renderEmpty(data) {
  const meta = data.meta || {};
  let datum = "Nada pendiente por ahora.";
  if (meta.paused_by_operator) datum = `Tienes ${meta.paused_by_operator} pausados a propósito.`;
  else if (meta.last_sale_at) datum = `Última venta: ${new Date(meta.last_sale_at).toLocaleDateString("es-MX")}.`;
  return `<p class="eyebrow">Radar · Hoy</p>
    <h1>${esc(pageHeadline(data))}</h1>
    <p class="lead">${esc(data.lead || "Hoy no hace falta comprar.")}</p>
    <div class="state"><h2>Hoy no hace falta comprar</h2><p>${esc(datum)}</p></div>`;
}

function renderCard(card, i) {
  const status = localStorage.getItem(storeKey(card.done_id)) || "";
  const cls = status === "done" ? "done" : status === "skip" ? "skipped" : "";
  const name = productName(card);
  const img = card.image_url
    ? `<img class="photo" src="${esc(card.image_url)}" alt=""/>`
    : `<div class="photo ph">Sin foto</div>`;
  const ceil = ceilingSentence(card);
  const why = humanWhy(card);
  const ev = evidenceLine(card.evidence);
  return `<article class="card ${cls}" data-done-id="${esc(card.done_id)}">
    <span class="badge ${esc(card.tipo)}">${esc(card.tipo)}</span>
    <div class="row">
      ${img}
      <div class="copy">
        <p class="index">#${i + 1}</p>
        <h2 class="title">${esc(name)}</h2>
        <p class="action-line">${esc(actionSentence(card))}</p>
        ${ceil ? `<p class="ceiling">${esc(ceil)}</p>` : ""}
        <p class="money">${esc(moneySentence(card))}</p>
        ${why ? `<p class="why">${esc(why)}</p>` : ""}
        ${ev ? `<p class="evidence">${esc(ev)}</p>` : ""}
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" data-act="done" ${status ? "disabled" : ""}>Ya lo hice</button>
      <button class="btn-secondary" data-act="skip" ${status ? "disabled" : ""}>Saltar</button>
    </div>
  </article>`;
}

function renderData(data) {
  const cards = (data.cards || []).slice(0, 3);
  if (!cards.length) return renderEmpty(data);
  return `<p class="eyebrow">Radar · Hoy</p>
    <h1>${esc(pageHeadline(data))}</h1>
    <p class="lead">${esc(pageLead(data))}</p>
    <div class="stack">${cards.map(renderCard).join("")}</div>
    <footer>Actualizado ${esc(data.generated_at || "")}</footer>`;
}

function wire(root) {
  root.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn || btn.disabled) return;
      const id = card.getAttribute("data-done-id");
      const act = btn.getAttribute("data-act") === "done" ? "done" : "skip";
      localStorage.setItem(storeKey(id), act);
      card.classList.toggle("done", act === "done");
      card.classList.toggle("skipped", act === "skip");
      card.querySelectorAll("button").forEach(b => b.disabled = true);
    });
  });
}

async function load() {
  const app = document.getElementById("app");
  app.innerHTML = renderLoading();
  try {
    const res = await fetch(JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("No encontré el archivo del día");
    const data = await res.json();
    app.innerHTML = renderData(data);
    wire(app);
  } catch (e) {
    app.innerHTML = renderError(e.message || "Error");
    document.getElementById("retry")?.addEventListener("click", load);
  }
}
load();
</script>
</body>
</html>
