<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f3f7fb"/>
<title>Radar · Hoy</title>
<style>
  :root {
    --bg:#f3f7fb; --card:#fff; --text:#12212f; --muted:#65748a; --muted-2:#8a95a5;
    --line:#e3ebf5; --green:#1f6349; --green-bg:#eaf7f1; --blue:#1d4f91; --blue-bg:#e8f1fb;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding:18px 14px 48px}
  .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
  h1{margin:0 0 8px;font-size:24px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
  .lead{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{flex:1 1 0;min-width:0;appearance:none;border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:12px;font-weight:700;line-height:1.25;padding:10px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--blue-bg);color:var(--blue);border-color:transparent}
  .stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(18,33,47,.06)}
  .card.done,.card.skipped{opacity:.48}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:999px;margin-bottom:10px}
  .badge.BUSCAR{color:#5b4a8a;background:#f1ecfb}
  .badge.REPONER{color:#1d4f91;background:#e8f1fb}
  .badge.ESTRELLA{color:#8a6a00;background:#fff6d6}
  .badge.CASHFLOW{color:#1f6349;background:var(--green-bg)}
  .row{display:flex;gap:12px;align-items:flex-start}
  .photo{width:92px;height:92px;object-fit:cover;border-radius:12px;background:#eef3f9;flex:0 0 auto}
  .photo.ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted-2);text-align:center;padding:6px}
  .copy{min-width:0;flex:1}
  .index{margin:0;font-size:11px;color:var(--muted-2);font-weight:700}
  .title{margin:2px 0 6px;font-size:17px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
  .qty-advice{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--text)}
  .plata{margin:0 0 6px;font-size:14px;font-weight:650;color:var(--green)}
  .why{margin:0 0 8px;font-size:13px;line-height:1.4;color:var(--muted)}
  .why strong{color:var(--text);font-weight:650}
  .evidence{margin:0 0 8px;font-size:12px;color:var(--muted-2)}
  .park-meta{margin:0 0 8px;font-size:12px;line-height:1.4;color:var(--muted);background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
  .links a{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none}
  .links a.primary{background:var(--blue-bg);color:var(--blue)}
  .links a.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .ghost-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;background:transparent;color:var(--blue);border:1px solid var(--line);cursor:pointer;font:inherit}
  .links a.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  .actions{margin-top:12px;display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
  button{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:10px;padding:12px 10px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .btn-primary{background:var(--green-bg);color:var(--green)}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
  .outcomes{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);gap:8px;grid-template-columns:1fr 1fr}
  .outcomes.open{display:grid}
  .outcomes button{font-size:13px;padding:11px 8px;background:#f7fafc;border:1px solid var(--line);color:var(--text)}
  .status{margin-top:10px;font-size:13px;color:var(--green);font-weight:650;display:none}
  .status.show{display:block}
  .state{margin-top:14px;background:#fff;border-radius:16px;padding:28px 18px;border:1px solid var(--line);text-align:center}
  .state h2{margin:0 0 8px;font-size:18px}
  .state p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .state .actions{max-width:200px;margin:16px auto 0;grid-template-columns:1fr}
  .skel{height:140px;border-radius:16px;background:linear-gradient(90deg,#e8eef6,#f7fafc,#e8eef6);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  footer{margin-top:22px;font-size:11px;color:var(--muted-2);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const JSON_URL = "./hoy_3_tarjetas.json";
const LOCAL_API = "http://127.0.0.1:8766/api/actions";
const HIDE_DAYS = { purchased: 7, not_found: 3, tomorrow: 1, descartado: 30, done: 1, skip: 1 };
const OUTCOME_TEXT = {
  purchased: "Anotado como comprado",
  not_found: "Anotado: no lo encontraste",
  tomorrow: "Lo dejamos para mañana",
  descartado: "Lo retiro por 30 días",
  done: "Hecho",
  skip: "Saltado por hoy"
};
const TAB_HOY = "hoy";
const TAB_QUEUE = "queue";
const TAB_DECIDED = "decided";

let cachedData = null;
let activeTab = TAB_HOY;

const money0 = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(Number(n));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey = (id) => `radar-hoy:v1:${id}`;

function productName(card) {
  const t = (card.title || "").trim();
  const generic = !t || /^Busca proveedor/i.test(t) || (/^Compra\s+\d+/i.test(t) && t.length < 28);
  if (!generic) return t;
  const m = (card.por_que || card.why_line || card.contexto_prompt || "").match(/·\s*([^:]+?)(?::|$)/);
  if (m) return m[1].replace(/…/g, "").trim();
  return card.sku || "este producto";
}

function verbTitle(card) {
  const name = productName(card);
  const n = Number(card.qty) || 1;
  if (card.action === "BUSCAR" || card.tipo === "BUSCAR") {
    return n === 1 ? `Busca quién te venda ${name}` : `Busca quién te venda ${name} (${n} piezas)`;
  }
  return n === 1 ? `Compra ${name}` : `Compra ${n} de ${name}`;
}

function plataLine(card) {
  const g = card.ganancia_estimada_mxn;
  if (g == null || Number.isNaN(Number(g))) return null;
  return `~gánele ${money0(g)}`;
}

/** Precio máximo a buscar + ganancia/ROI en una frase humana */
function priceGoalLine(card) {
  const cap = card.max_landed_cost;
  const g = card.ganancia_estimada_mxn;
  const r = card.roi_pct;
  const hasCap = cap != null && !Number.isNaN(Number(cap)) && Number(cap) > 0;
  if (!hasCap) return null;
  const price = money0(cap);
  const hasG = g != null && !Number.isNaN(Number(g));
  const hasR = r != null && !Number.isNaN(Number(r));
  if (hasG && hasR) {
    return `Búscalo en menos de ${price} para ganar ~${money0(g)} (ROI ~${Number(r).toFixed(0)}%)`;
  }
  if (hasG) {
    return `Búscalo en menos de ${price} para ganar ~${money0(g)}`;
  }
  if (hasR) {
    return `Búscalo en menos de ${price} para mantener un ROI de ~${Number(r).toFixed(0)}%`;
  }
  return `Búscalo en menos de ${price} para no comerse la ganancia`;
}

function suggestedQty(card) {
  const n = Number(card.qty_si_techo != null ? card.qty_si_techo : card.qty);
  return (!n || Number.isNaN(n) || n < 1) ? 1 : n;
}

function qtyAdviceLine(card) {
  const n = suggestedQty(card);
  const piezas = n === 1 ? "1 pieza" : n + " piezas";
  return "Si lo consigues a ese precio, compra " + piezas;
}

function whyText(card) {
  if (card.why_line && String(card.why_line).trim()) return String(card.why_line).trim();
  if (card.contexto_prompt && String(card.contexto_prompt).trim()) return String(card.contexto_prompt).trim();
  const ev = card.evidence || {};
  const bits = [];
  if (ev.soh === 0) bits.push("se te acabó");
  if ((ev.sales_30 || 0) > 0 || (ev.sales_90 || 0) > 0) bits.push("se vende seguido");
  if (card.tipo === "ESTRELLA") bits.push("es de tus estrellas");
  if (card.tipo === "CASHFLOW") bits.push("suelta caja rápido");
  if (card.action === "BUSCAR" || card.tipo === "BUSCAR") bits.push("ya no tienes de dónde comprarlo");
  if (bits.length) return [...new Set(bits)].slice(0, 2).join(" y ") + ".";
  let s = (card.por_que || "")
    .replace(/\bsin buy path\b/gi, "")
    .replace(/\bagotado el canal\b/gi, "")
    .replace(/\bbuen historial\b/gi, "")
    .replace(/\bVuelve a buscar proveedor de[^:]+:\s*/i, "")
    .replace(/\s*\/\s*/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (s && s.length < 110) return s.charAt(0).toUpperCase() + s.slice(1);
  return "Vale la pena checarlo hoy.";
}

function evidenceLine(ev) {
  if (!ev) return "";
  const a = [];
  if (ev.sales_30 != null) a.push(`${ev.sales_30} en 30d`);
  if (ev.sales_90 != null) a.push(`${ev.sales_90} en 90d`);
  if (ev.soh != null) a.push(`stock ${ev.soh}`);
  if (ev.days_since_last_sale != null) a.push(`última venta hace ${ev.days_since_last_sale}d`);
  if (ev.unit_margin != null) a.push(`margen ~${money0(ev.unit_margin)}`);
  return a.join(" · ");
}

function shoppingHref(card, name) {
  if (card.shopping_url) return card.shopping_url;
  return "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(name);
}

function mlHref(card, name) {
  if (card.marketplace_url) return card.marketplace_url;
  if (card.meli_id) return "https://www.mercadolibre.com.mx/p/" + encodeURIComponent(card.meli_id);
  return "https://listado.mercadolibre.com.mx/" + encodeURIComponent(name).replace(/%20/g, "-");
}

function contextText(card) {
  return (card.contexto_prompt || card.why_line || card.por_que || card.why || "").trim();
}
function keepaHref(card) {
  const asin = (card.asin || "").trim();
  if (!asin) return null;
  return "https://keepa.com/#!product/11-" + encodeURIComponent(asin);
}

function storeLinks(card) {
  const arr = Array.isArray(card.marketplace_urls) ? card.marketplace_urls : [];
  return arr.filter(u => typeof u === "string" && /^https?:\/\//i.test(u));
}

function readState(id) {
  try { return JSON.parse(localStorage.getItem(storeKey(id)) || "null"); } catch { return null; }
}

function writeState(obj) {
  localStorage.setItem(storeKey(obj.done_id), JSON.stringify(obj));
}

function isHidden(st) {
  if (!st || !st.hide_until) return false;
  const t = Date.parse(st.hide_until);
  return !Number.isNaN(t) && t > Date.now();
}

function hideDaysFor(outcome, card) {
  if (card && card.hide_days_default != null && outcome === "done") return Number(card.hide_days_default) || 1;
  return HIDE_DAYS[outcome] != null ? HIDE_DAYS[outcome] : 1;
}

function hideUntilIso(days) {
  const d = new Date();
  d.setDate(d.getDate() + (Number(days) || 0));
  return d.toISOString();
}

function formatHideUntil(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return String(iso);
  try {
    return new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", year: "numeric" }).format(new Date(t));
  } catch {
    return String(iso);
  }
}

function pageHeadline(tab, n) {
  if (tab === TAB_QUEUE) {
    if (!n) return "Sin más oportunidades";
    return n === 1 ? "1 oportunidad más" : `${n} oportunidades más`;
  }
  if (tab === TAB_DECIDED) {
    if (!n) return "Nada decidido aún";
    return n === 1 ? "1 ya decidida" : `${n} ya decididas`;
  }
  if (!n) return "Hoy no tienes que comprar nada";
  return n === 1 ? "Hoy: 1 cosa" : `Hoy: ${n} cosas`;
}

function pageLead(tab, cards, data) {
  if (tab === TAB_QUEUE) {
    if (!cards.length) return "Cuando haya cola, aparece aquí.";
    return "Otras opciones si te sobra tiempo.";
  }
  if (tab === TAB_DECIDED) {
    if (!cards.length) return "Aquí verás lo pausado o descartado.";
    return "Pausadas, descartadas o ya resueltas.";
  }
  if (!cards.length) return data.lead || "Respira. Nada urgente.";
  const buscar = cards.filter(c => c.action === "BUSCAR" || c.tipo === "BUSCAR").length;
  const comprar = cards.length - buscar;
  const bits = [];
  if (comprar > 0) bits.push(comprar === 1 ? "1 para comprar" : `${comprar} para comprar`);
  if (buscar > 0) bits.push(buscar === 1 ? "1 para buscar quién te lo venda" : `${buscar} para buscar proveedor`);
  return bits.join(". ") + ".";
}

function statusMessage(st) {
  if (!st) return "";
  const base = OUTCOME_TEXT[st.outcome] || "Guardado";
  const days = st.hide_days;
  return days ? `${base} · no vuelve por ${days} días` : base;
}

function decidedMetaLine(card) {
  const parts = [];
  if (card.reason && String(card.reason).trim()) parts.push(String(card.reason).trim());
  if (card.park_note && String(card.park_note).trim()) parts.push(String(card.park_note).trim());
  if (card.outcome && String(card.outcome).trim()) {
    const o = String(card.outcome).trim();
    parts.push(OUTCOME_TEXT[o] || o);
  }
  if (card.hide_until && String(card.hide_until).trim()) {
    parts.push("oculto hasta " + formatHideUntil(card.hide_until));
  }
  return parts.join(" · ");
}

function tabLists(data) {
  const cards = (data.cards || []).slice(0, 3);
  const queue = Array.isArray(data.queue) ? data.queue : [];
  const decided = Array.isArray(data.dismissed_or_paused)
    ? data.dismissed_or_paused
    : (Array.isArray(data.parked) ? data.parked : []);
  return { cards, queue, decided };
}

function filterVisible(cards) {
  return cards.filter(c => !isHidden(readState(c.done_id)));
}

function countsFor(data) {
  const lists = tabLists(data);
  return {
    hoy: filterVisible(lists.cards).length,
    queue: lists.queue.length,
    decided: lists.decided.length
  };
}

function cardsForActiveTab(data) {
  const lists = tabLists(data);
  if (activeTab === TAB_QUEUE) return lists.queue;
  if (activeTab === TAB_DECIDED) return lists.decided;
  return filterVisible(lists.cards);
}

function renderLoading() {
  return `<p class="eyebrow">Radar · Hoy</p><h1>Cargando…</h1><div class="stack"><div class="skel"></div><div class="skel"></div></div>`;
}

function renderError(msg) {
  return `<p class="eyebrow">Radar · Hoy</p><h1>No pude cargar el día</h1>
    <div class="state"><h2>Algo falló</h2><p>${esc(msg)}</p>
    <div class="actions"><button class="btn-primary" id="retry">Reintentar</button></div></div>`;
}

function renderTabs(counts) {
  const items = [
    { id: TAB_HOY, label: `Hoy (${counts.hoy})` },
    { id: TAB_QUEUE, label: `Más oportunidades (${counts.queue})` },
    { id: TAB_DECIDED, label: `Ya decididas (${counts.decided})` }
  ];
  return `<div class="tabs" role="tablist">${items.map(t =>
    `<button type="button" class="tab${activeTab === t.id ? " active" : ""}" role="tab" aria-selected="${activeTab === t.id ? "true" : "false"}" data-tab="${t.id}">${esc(t.label)}</button>`
  ).join("")}</div>`;
}

function photoHtml(card) {
  const rawImg = card.image_url || "";
  const isData = /^data:/i.test(rawImg);
  const heavyData = isData && rawImg.length > 120000;
  // http(s) images always show; heavy data URIs → «Foto pesada» (never label that as «Sin foto»)
  if (rawImg && !heavyData) {
    return `<img class="photo" src="${esc(rawImg)}" alt=""/>`;
  }
  return `<div class="photo ph">${rawImg ? "Foto pesada" : "Sin foto"}</div>`;
}

function renderCard(card, i, opts) {
  const decided = !!(opts && opts.decided);
  const name = productName(card);
  const st = readState(card.done_id);
  const cls = !st ? "" : (st.outcome === "skip" ? "skipped" : "done");
  const img = photoHtml(card);
  const plata = plataLine(card);
  const goal = priceGoalLine(card);
  const ev = evidenceLine(card.evidence);
  const locked = decided || (!!st && isHidden(st));
  const stores = storeLinks(card);
  const storeHtml = stores.map(u => `<a class="ghost" href="${esc(u)}" target="_blank" rel="noopener">Abrir tienda</a>`).join("");
  const parkLine = decided ? decidedMetaLine(card) : "";
  const statusFromCard = decided
    ? (statusMessage(st) || (card.outcome ? (OUTCOME_TEXT[card.outcome] || card.outcome) : "") || "Ya decidida")
    : statusMessage(st);
  const showStatus = decided || !!st;
  const actionsHtml = decided
    ? `<p class="status show" data-status>${esc(statusFromCard)}</p>`
    : `<div class="actions">
      <button class="btn-primary" data-act="done" ${locked ? "disabled" : ""}>Ya lo hice</button>
      <button class="btn-secondary" data-act="skip" ${locked ? "disabled" : ""}>Saltar</button>
    </div>
    <div class="outcomes" data-outcomes>
      <button type="button" data-outcome="purchased">Ya lo compré</button>
      <button type="button" data-outcome="not_found">No lo encontré</button>
      <button type="button" data-outcome="tomorrow">Mañana</button>
      <button type="button" data-outcome="descartado">Descartar 30d</button>
    </div>
    <p class="status ${showStatus ? "show" : ""}" data-status>${esc(statusFromCard)}</p>`;

  return `<article class="card ${cls}" data-done-id="${esc(card.done_id)}" data-context="${esc(contextText(card))}" data-sku="${esc(card.sku)}" data-action-key="${esc(card.done_id)}" data-tab-kind="${decided ? "decided" : "active"}">
    <span class="badge ${esc(card.tipo)}">${esc(card.tipo)}</span>
    <div class="row">
      ${img}
      <div class="copy">
        <p class="index">#${i + 1}</p>
        <h2 class="title">${esc(verbTitle(card))}</h2>
        ${goal ? `<p class="plata">${esc(goal)}</p>` : (plata ? `<p class="plata">${esc(plata)}</p>` : "")}
        <p class="qty-advice">${esc(qtyAdviceLine(card))}</p>
        <p class="why"><strong>Por qué:</strong> ${esc(whyText(card))}</p>
        ${ev ? `<p class="evidence">${esc(ev)}</p>` : ""}
        ${decided && parkLine ? `<p class="park-meta">${esc(parkLine)}</p>` : ""}
        <div class="links">
          <a class="primary" href="${esc(shoppingHref(card, name))}" target="_blank" rel="noopener">Buscar precio</a>
          <a class="secondary" href="${esc(mlHref(card, name))}" target="_blank" rel="noopener">Ver en Mercado Libre</a>
          ${keepaHref(card) ? `<a class="ghost" href="${esc(keepaHref(card))}" target="_blank" rel="noopener">Abrir en Keepa</a>` : ""}
          ${storeHtml}
          ${contextText(card) ? `<button type="button" class="ghost-btn" data-act="copy-ctx">Copiar contexto</button>` : ""}
        </div>
      </div>
    </div>
    ${actionsHtml}
  </article>`;
}

function emptyCopy(tab, data, reason) {
  const meta = data.meta || {};
  if (reason) return reason;
  if (tab === TAB_HOY && meta.paused_by_operator) {
    return `Tienes ${meta.paused_by_operator} pausados a propósito.`;
  }
  if (tab === TAB_QUEUE) return "La cola está vacía por ahora.";
  if (tab === TAB_DECIDED) return "Todavía no hay pausadas ni descartadas.";
  return "Nada pendiente.";
}

function renderData(data) {
  const lists = tabLists(data);
  const counts = countsFor(data);
  const cards = cardsForActiveTab(data);
  const tabs = renderTabs(counts);
  let body;
  if (!cards.length) {
    let reason = null;
    if (activeTab === TAB_HOY) {
      const hidden = lists.cards.length && filterVisible(lists.cards).length === 0;
      reason = hidden ? "Ya resolviste las de hoy (siguen ocultas un rato)." : null;
    }
    body = `<div class="state"><h2>${esc(pageHeadline(activeTab, 0))}</h2><p>${esc(emptyCopy(activeTab, data, reason))}</p>${
      activeTab === TAB_HOY
        ? `<div class="actions"><button class="btn-secondary" id="resetHidden">Ver de nuevo</button></div>`
        : ""
    }</div>`;
  } else {
    body = `<div class="stack">${cards.map((c, i) => renderCard(c, i, { decided: activeTab === TAB_DECIDED })).join("")}</div>`;
  }
  return `<p class="eyebrow">Radar · Hoy</p>
    <h1>${esc(pageHeadline(activeTab, cards.length))}</h1>
    <p class="lead">${esc(pageLead(activeTab, cards, data))}</p>
    ${tabs}
    ${body}
    <footer>Actualizado ${esc(data.generated_at || "")} · <button type="button" id="resetHidden" style="all:unset;color:var(--blue);font-weight:700;cursor:pointer">Ver de nuevo</button></footer>`;
}

async function mirrorLocal(card, outcome) {
  try {
    await fetch(LOCAL_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sku: card.getAttribute("data-sku"),
        action_key: card.getAttribute("data-action-key"),
        outcome
      })
    });
  } catch (_) { /* silencioso — Pages no depende de :8766 */ }
}

function lockCard(card, outcome) {
  const doneId = card.getAttribute("data-done-id");
  const sku = card.getAttribute("data-sku");
  const days = hideDaysFor(outcome, null);
  const payload = {
    done_id: doneId,
    sku,
    outcome,
    hide_until: hideUntilIso(days),
    hide_days: days
  };
  writeState(payload);
  mirrorLocal(card, outcome);
  if (activeTab === TAB_HOY && isHidden(payload)) {
    if (cachedData) {
      paint(cachedData);
      return;
    }
  }
  card.classList.toggle("done", outcome !== "skip");
  card.classList.toggle("skipped", outcome === "skip");
  card.querySelectorAll(".actions button").forEach(b => { b.disabled = true; });
  card.querySelector("[data-outcomes]")?.classList.remove("open");
  const status = card.querySelector("[data-status]");
  if (status) { status.textContent = statusMessage(payload); status.classList.add("show"); }
}

function wire(root) {
  root.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      const next = btn.getAttribute("data-tab");
      if (!next || next === activeTab) return;
      activeTab = next;
      if (cachedData) paint(cachedData);
    });
  });
  root.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", async (ev) => {
      const copyBtn = ev.target.closest("button[data-act='copy-ctx']");
      if (copyBtn) {
        const txt = card.getAttribute("data-context") || "";
        try {
          await navigator.clipboard.writeText(txt);
          copyBtn.textContent = "Copiado";
          setTimeout(() => { copyBtn.textContent = "Copiar contexto"; }, 1200);
        } catch (_) {
          copyBtn.textContent = "No se pudo copiar";
          setTimeout(() => { copyBtn.textContent = "Copiar contexto"; }, 1500);
        }
        return;
      }
      if (card.getAttribute("data-tab-kind") === "decided") return;
      const doneBtn = ev.target.closest("button[data-act='done']");
      const skipBtn = ev.target.closest("button[data-act='skip']");
      const outBtn = ev.target.closest("button[data-outcome]");
      if (doneBtn && !doneBtn.disabled) {
        card.querySelector("[data-outcomes]")?.classList.toggle("open");
        return;
      }
      if (skipBtn && !skipBtn.disabled) { lockCard(card, "skip"); return; }
      if (outBtn) lockCard(card, outBtn.getAttribute("data-outcome"));
    });
  });
}

function paint(data) {
  const app = document.getElementById("app");
  app.innerHTML = renderData(data);
  wire(app);
  document.getElementById("resetHidden")?.addEventListener("click", radarResetHidden);
}

function radarResetHidden() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith("radar-hoy:")) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  activeTab = TAB_HOY;
  load();
}

async function load() {
  const app = document.getElementById("app");
  app.innerHTML = renderLoading();
  try {
    const res = await fetch(JSON_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("No encontré el archivo del día");
    const data = await res.json();
    cachedData = data;
    paint(data);
  } catch (e) {
    app.innerHTML = renderError(e.message || "Error");
    document.getElementById("retry")?.addEventListener("click", load);
  }
}

load();
</script>
</body>
</html>
